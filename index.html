<meta charset="utf-8">
<title>Alpha NextGen Eclipse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* Layout: console app — navy header, capsule process rail, tool bar, Excel-style frozen grid */
:root{
  --navy:#0f2a4a; --navy-2:#173a63; --teal:#0e8f8a; --teal-soft:#d9f1ef; --amber:#e9a23b; --amber-soft:#fbedd5;
  --bg:#eef2f6; --panel:#ffffff; --line:#d5dde7; --ink:#14243a; --muted:#5d6e84; --cellin:#f6fbfb; --danger:#c2413a;
  --f-disp:"Sora",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-num:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#0a1d35; --navy-2:#13345a; --teal:#2bb5ae; --teal-soft:#123a3c; --amber:#f0b45a; --amber-soft:#3a2d17;
  --bg:#0b1522; --panel:#122033; --line:#26384f; --ink:#e4ecf5; --muted:#8fa2ba; --cellin:#0f1c2d; --danger:#e26a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0a1d35; --navy-2:#13345a; --teal:#2bb5ae; --teal-soft:#123a3c; --amber:#f0b45a; --amber-soft:#3a2d17;
  --bg:#0b1522; --panel:#122033; --line:#26384f; --ink:#e4ecf5; --muted:#8fa2ba; --cellin:#0f1c2d; --danger:#e26a62; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.hl{width:100%;min-width:72px;background:transparent;border:1px dashed currentColor;border-radius:6px;color:inherit;font:inherit;text-align:center;padding:3px 4px;opacity:.95}
.hl:focus{background:#ffffff26;border-style:solid;outline:none}
.h-task .hl{min-width:0;font-size:10px}
.hl.ht2{display:block;resize:none;height:30px;line-height:1.15;white-space:normal;overflow-wrap:anywhere;overflow:hidden;padding:2px 3px;text-align:center;font-size:9.5px;min-width:44px}
.hl.ht{display:block;resize:none;height:44px;line-height:1.2;white-space:normal;overflow-wrap:anywhere;word-break:break-word;overflow:hidden;padding:3px 5px;text-align:center}
td.name .nmw{display:flex;align-items:center;gap:6px}
td.name input{background:transparent;text-align:left;padding:0 4px;height:auto;width:100%;min-width:0}
td.name input.nm{font-family:var(--f-body);font-weight:600;font-size:12px;height:17px}
td.name input.tm{font-family:var(--f-body);font-size:9px;color:var(--muted);height:12px}
td.name input:focus,td.proc input:focus{background:var(--amber-soft)}
td.proc input{width:100%;background:transparent;text-align:center;font-family:var(--f-body);font-weight:600;color:var(--teal);padding:0 4px}
td.name{height:32px}
.rm{flex:none;border:0;cursor:pointer;width:22px;height:22px;border-radius:999px;background:#c2413a1f;color:var(--danger);font-size:11px;line-height:1}
.rm:active{transform:translateY(1px);box-shadow:inset 0 2px 4px #00000030}
.till,.xtag{flex:none;font-size:9px;font-family:var(--f-num);padding:1px 6px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.xtag{background:#c2413a1f;color:var(--danger);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
tr.xr td{opacity:.55}
tr.xr input{pointer-events:none}
@media (max-width:600px){
  .sticky1{position:static}
  .sticky2{left:0}
  td.name{min-width:150px}
  td.proc{width:56px;min-width:56px}
  .top{position:static}
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* capsule buttons — pressed state sinks in */
.cap{border:0;cursor:pointer;border-radius:999px;padding:9px 18px;font-weight:600;font-size:13px;letter-spacing:.02em;
  background:linear-gradient(180deg,#ffffff22,#00000010),var(--panel);color:var(--ink);
  box-shadow:0 3px 0 var(--line),0 6px 14px #0f2a4a1f,inset 0 1px 0 #ffffff60;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.cap:active,.cap.on{transform:translateY(3px);box-shadow:0 0 0 var(--line),inset 0 3px 8px #00000038,inset 0 -1px 0 #ffffff30}
.cap:disabled{opacity:.45;cursor:default}
.cap.teal{background:linear-gradient(180deg,#ffffff2a,#00000018),var(--teal);color:#fff;box-shadow:0 3px 0 #0a5f5b,0 6px 14px #0e8f8a40,inset 0 1px 0 #ffffff50}
.cap.teal:active,.cap.teal.on{box-shadow:0 0 0 #0a5f5b,inset 0 3px 8px #00000050}
.cap.amber{background:linear-gradient(180deg,#ffffff30,#00000012),var(--amber);color:#2a1a02;box-shadow:0 3px 0 #a86f1c,0 6px 14px #e9a23b40,inset 0 1px 0 #ffffff70}
.cap.amber:active,.cap.amber.on{box-shadow:0 0 0 #a86f1c,inset 0 3px 8px #00000040}
.cap.ghost{background:transparent;color:#cfe0f2;box-shadow:inset 0 0 0 1px #ffffff35}
.cap.ghost:active,.cap.ghost.on{box-shadow:inset 0 2px 6px #00000060;background:#ffffff14}
.cap.sm{padding:6px 13px;font-size:12px}

.brand{font-family:var(--f-disp);font-weight:800;letter-spacing:.01em;line-height:1.1;font-size:19px}
.brand span{color:var(--amber)}
.ver{display:inline-block;font-family:var(--f-num);font-size:11px;padding:3px 9px;border-radius:999px;background:#ffffff18;letter-spacing:.06em;color:#dbe7f4}

#app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 16px #00000030}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.chip.mgr{background:var(--amber);color:#2a1a02}.chip.view{background:#ffffff1c;color:#cfe0f2}
.exp{font-family:var(--f-num);font-size:11px;color:#a9c0d8}
.rail{background:var(--navy-2);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;overflow-x:auto}
.rail .cap.soon{opacity:.62}
.rail .cap .tag{font-size:9px;font-weight:700;letter-spacing:.08em;margin-left:8px;padding:2px 6px;border-radius:999px;background:#0000001f}
.rail .cap.teal .tag{background:#ffffff30}
.wrap{flex:1;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.fld select,.fld input{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:130px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding-bottom:8px;cursor:pointer}
.bar .grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat b{display:block;font-family:var(--f-num);font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat.hi b{color:var(--teal)}

.dump{border:2px dashed var(--teal);border-radius:16px;background:var(--teal-soft);padding:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dump p{margin:0;flex:1;min-width:220px;line-height:1.55}
.dump textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:10px;font-family:var(--f-num);font-size:12px}
.dump.drag{background:var(--amber-soft);border-color:var(--amber)}

.gridbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:70vh;min-width:0}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;height:26px;white-space:nowrap}
thead th{position:sticky;z-index:3;font-size:10px;font-weight:600;text-align:center;padding:3px 4px}
thead tr:nth-child(1) th{top:0;height:52px}
thead tr:nth-child(2) th{top:52px;height:30px}
thead tr:nth-child(3) th{top:82px}
.h-task{background:var(--navy);color:#fff;font-family:var(--f-disp);font-size:10px;width:100px;max-width:100px;min-width:96px;white-space:normal;line-height:1.2;padding:4px 5px}
.h-task small{display:block;font-family:var(--f-body);font-weight:500;font-size:9px;color:#9fb5cc;margin-bottom:2px}
.h-sub{background:var(--navy-2);color:#cfe0f2;font-family:var(--f-num)}
.h-sub input.ovr{border-color:var(--amber);color:var(--amber)}
.h-sub{padding:3px 4px}
.h-sub input{width:44px;text-align:center;background:#ffffff18;border:1px solid #ffffff35;border-radius:6px;color:#fff;padding:2px;font-family:var(--f-num);font-size:11px}
.h-sub input:disabled{background:transparent;border-color:transparent;color:#cfe0f2;-webkit-text-fill-color:#cfe0f2;opacity:1}
.h-cnt{background:var(--navy-2);color:#9fb5cc;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.h-amb{background:var(--amber);color:#2a1a02}
.h-amb2{background:var(--amber-soft);color:var(--ink);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.h-fix{background:var(--navy);color:#fff}
.sticky1{position:sticky;left:0;z-index:2}
.sticky2{position:sticky;left:58px;z-index:2;box-shadow:3px 0 6px #0f2a4a18}
thead .sticky1,thead .sticky2{z-index:5}
td.proc{width:58px;min-width:58px;text-align:center;font-weight:600;font-size:12px;background:var(--teal-soft);color:var(--teal)}
td.name{min-width:170px;padding:0 6px;font-weight:600;background:var(--panel)}
td.name small{display:block;font-weight:400;font-size:10px;color:var(--muted);line-height:1}
td input{width:48px;height:25px;border:0;background:var(--cellin);text-align:right;padding:0 5px;font-family:var(--f-num);font-size:11px}
td input:focus{background:var(--amber-soft);outline:2px solid var(--amber);outline-offset:-2px}
td.calc{min-width:48px;text-align:right;padding:0 5px;font-family:var(--f-num);font-size:11px;color:var(--muted)}
td.calc.nz{color:var(--ink);font-weight:600}
td.tot{background:var(--teal-soft);font-weight:600;color:var(--ink)}
td.pct{min-width:68px;font-size:11px!important;text-align:center;font-weight:700;font-family:var(--f-num);font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px}
.p-lo{background:#c2413a22;color:var(--danger)}.p-md{background:var(--amber-soft);color:#a86f1c}.p-hi{background:#0e8f8a26;color:var(--teal)}
td input.cm{width:110px;text-align:left}
.lockbadge{font-size:11px;padding:6px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-bottom:4px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-size:12px;color:var(--muted)}

.soonbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:56px 20px;text-align:center}
.soonbox h2{font-family:var(--f-disp);font-size:30px;margin:12px 0 8px;text-wrap:balance}
.soonbox p{color:var(--muted);margin:0}

.modal{position:fixed;inset:0;background:#06101ccc;z-index:50;display:grid;place-items:center;padding:16px}
.mcard{background:var(--panel);border-radius:18px;width:100%;max-width:580px;max-height:86vh;overflow:auto;padding:20px;border:1px solid var(--line)}
.mcard h3{font-family:var(--f-disp);margin:0 0 10px}
.mcard h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:flex-end}
.mrow input,.mrow select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);flex:1;min-width:110px}
.mrow label{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px;font-size:11px;color:var(--muted)}
.fx{font-family:var(--f-num);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.8}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
.rep li{margin:4px 0;line-height:1.5}
.ok{color:var(--teal);font-weight:600}.bad{color:var(--danger);font-weight:600}

.gate{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;color:#eaf2fb;
  background:radial-gradient(1100px 600px at 10% 0%,var(--navy-2),transparent 60%),radial-gradient(800px 500px at 100% 100%,#0e8f8a55,transparent 60%),#0b1f38}
.gate .lcard{max-width:420px;box-shadow:0 30px 60px #00000055;backdrop-filter:blur(14px)}
.pcbox{margin:22px 0 4px;padding:14px;border-radius:14px;background:#00000030;border:1px solid #ffffff22}
.pcbox small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#a9c0d8}
.pcbox b{display:block;font-family:var(--f-num);font-size:19px;margin-top:6px;letter-spacing:.04em}
.denied{color:#ffb3ad}.denied b{color:#ffd2ce}
.gate .cap{width:100%;margin-top:16px;padding:13px}
.gate .lnk{background:none;border:0;color:#a9c0d8;font-size:12px;margin-top:14px;cursor:pointer;text-decoration:underline}
#lock{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:radial-gradient(900px 500px at 15% 0%,var(--navy-2),transparent 60%),var(--navy);color:#eaf2fb}
.lcard{width:100%;max-width:400px;background:#ffffff10;border:1px solid #ffffff22;border-radius:22px;padding:28px 24px;text-align:center}
.lcard input{width:100%;margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid #ffffff2a;background:#00000030;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;z-index:90;font-size:13px;box-shadow:0 10px 24px #00000040;max-width:90vw;text-align:center}
@media (max-width:600px){.brand{font-size:16px}.fld select,.fld input{min-width:105px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.datebar{align-items:center}
.dinfo{font-size:12px;color:var(--muted);line-height:1.4;min-width:0}
.dinfo b{color:var(--ink)}
.cap.danger{color:var(--danger)}
.dhead{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;width:100%}
.dhead p{flex:1;min-width:220px}
.empty{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:40px 20px;text-align:center}
.empty h2{font-family:var(--f-disp);margin:0 0 8px;font-size:24px;text-wrap:balance}
.empty p{color:var(--muted);margin:0 auto;max-width:56ch;line-height:1.55}
.stat.lo b{color:var(--danger)}
.pclist{display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow:auto}
.pcchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px}
.pcchip small{color:var(--muted)}
.pcchip button{border:0;background:#c2413a1f;color:var(--danger);border-radius:999px;width:18px;height:18px;font-size:10px;cursor:pointer}
optgroup{font-weight:700}
.banner{background:var(--amber-soft);border:1px solid var(--amber);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600}
.dirty{margin-left:10px;color:#a86f1c;font-weight:700;font-size:12px}
.cap.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #e9a23b55,0 3px 0 #a86f1c}}
.hlt{display:block;white-space:normal;line-height:1.2;font-size:10px;overflow-wrap:break-word;word-break:normal}
.h-cnt .hlt{white-space:nowrap}
.h-task .hlt{overflow-wrap:anywhere}
.acard.wide{grid-column:1/-1}
.ro{display:block;min-width:44px;padding:0 5px;text-align:right;font-family:var(--f-num);font-size:11px;line-height:25px}
.ro.cm{text-align:left;min-width:100px;font-family:var(--f-body)}
.nmt{font-weight:600;font-size:12px;padding:0 4px}.tmt{font-size:9px;color:var(--muted);padding:0 4px}
.adminpg{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-block:env(safe-area-inset-top,0px) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.apin{max-width:1100px;margin:0 auto}
.ahead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 0 12px;border-bottom:1px solid var(--line)}
.atabs{display:flex;gap:8px;flex-wrap:wrap}
.abody{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:14px;padding-top:14px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.acard h4{margin:0 0 6px;font-family:var(--f-disp);font-size:14px}
.acard.danger{border-color:#c2413a55}
.ahelp{margin:4px 0 8px;color:var(--muted);font-size:13px;line-height:1.5}
.ahelp code,.mrow code{font-family:var(--f-num);font-size:11px;background:var(--bg);padding:1px 5px;border-radius:5px}
.utable{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:12px}
.utable table{width:100%}
.utable th{position:sticky;top:0;background:var(--navy);color:#fff;font-size:11px;padding:6px 8px;height:auto;z-index:1}
.utable td{padding:4px 8px;font-size:12px;height:auto}
.utable td input,.utable td select{width:100%;min-width:90px;height:28px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 6px;font-family:var(--f-body)}
.utable tr.lock td{color:var(--muted)}
.perm td{text-align:center}.perm td:first-child{text-align:left}
.perm input[type=checkbox]{width:18px;height:18px;accent-color:var(--teal)}
.perm tr.scope td{background:var(--teal-soft)}
.toggles{display:flex;flex-wrap:wrap;gap:10px 18px}
.tg{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg span{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.tg span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px #0003}
.tg input:checked+span{background:var(--teal)}.tg input:checked+span::after{left:19px}
.tg input:focus-visible+span{outline:2px solid var(--amber);outline-offset:2px}
.fstat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.mrow textarea{flex:1;min-width:200px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px;font-family:var(--f-num);font-size:12px}
.confirm{border:1px solid var(--danger);border-radius:12px;padding:10px 12px;margin-top:10px}

.pvw{overflow:auto;max-height:42vh;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.pvw table{width:100%}
.pvw th{position:sticky;top:0;background:var(--navy);color:#fff;font-size:11px;padding:6px 8px;height:auto}
.pvw td{padding:4px 8px;font-size:12px;font-family:var(--f-num);height:auto;text-align:center}

}

async function binList(){

/* ---------- formulas (same as the Excel sheet) ---------- */
function calc(r,T){
  let total=0;const times={};
  T.forEach(t=>{const n=+r.c[t.k]||0;const tm=n/perHr(t);times[t.k]=tm;total+=tm});        // Time = Count / Per hour (Per hour = 60/AHT unless typed)
  const dtSum=DT.reduce((a,[k])=>a+(+r.dt[k]||0),0);
  const dtHr=S.cfg.dtUnit==="min"?dtSum/60:dtSum;                                         // Total Downtime = SUM/60
  const hours=(+r.full||0)-(+r.lv||0);                                                     // No. of Hours = 100% − Leaves
  const prod=hours-dtHr;                                                                   // Production Hours = No. of Hours − Downtime
  return{times,total,dtHr,hours,prod,pct:prod>0?total/prod*100:0};                        // Productivity = Total / Production Hours
}
const perHr=t=>t.ph>0?t.ph:60/t.aht;
const tg=p=>{const t=(S.cfg.tgt||{})[p];return{g:t&&t.g>0?+t.g:S.cfg.g,a:t&&t.a>0?+t.a:S.cfg.a}};
const band=(p,proc)=>{const t=tg(proc||view.proc);return p>=t.g?"p-hi":p>=t.a?"p-md":"p-lo"};
function sumUp(rows,T){let tot=0,prod=0,dt=0;rows.forEach(r=>{const c=calc(r,T);tot+=c.total;prod+=c.prod;dt+=c.dtHr});return{tot,prod,dt,pct:prod>0?tot/prod*100:0}}
function flagOf(r,c){
  if(!can("flag"))return "";
  if(c.pct>(+S.cfg.flagHi||150))return "Productivity above "+(+S.cfg.flagHi||150)+"%";
  if(c.total===0&&c.hours>0&&!(+r.lv>0))return "No count but full hours (leave not marked?)";
  if(c.prod<0)return "Downtime is more than the hours";
  return "";
}

function spark(vals,w=220,hgt=46){

  return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" width="100%" height="${hgt}" aria-hidden="true"><line x1="0" x2="${w}" y1="${y(tg(view.proc).g)}" y2="${y(tg(view.proc).g)}" class="sg"/><polyline points="${pts}" class="sl"/>${vals.map((v,i)=>`<circle cx="${(i*step).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.4" class="sp"/>`).join("")}</svg>`;
}

/* paste a block from Excel (many columns / rows) into the grid: fills to the right and down from the box you click */

  if(!(el.dataset.c||el.dataset.d||el.dataset.f||el.dataset.cm||el.dataset.ft||el.dataset.fp))return;

  const tr=el.closest("tr"),keys=el.closest("#gb")&&VG&&VG.keys?VG.keys:[...tr.querySelectorAll("input[data-c],input[data-d],input[data-f],input[data-cm],input[data-ft],input[data-fp]")].map(x=>({...x.dataset})),start=keys.findIndex(k=>JSON.stringify(k)===JSON.stringify({...el.dataset}));
  const list=rowsFiltered(),pos=list.findIndex(x=>String(x.i)===tr.dataset.i),num=v=>v===""||isNaN(+v)?undefined:+v;let n=0;
  rows.forEach((cells,k)=>{const R=list[pos+k];if(!R)return;const r=R.r;
    cells.forEach((v,j)=>{const key=keys[start+j];if(!key)return;v=String(v).trim();
      if(key.cm){r.cm=v}else{v=num(v.replace(/[,%\s]/g,""));if(key.ft||key.fp){const f=key.ft||key.fp;let pv=cfPv(r,f),today=(+cfGet(r,f)||0)-pv;if(key.ft)today=v||0;else pv=v||0;cfSetPv(r,f,pv);cfSet(r,f,pv+today)}else if(key.c)r.c[key.c]=v;else if(key.d)r.dt[key.d]=v;else if(key.f){if(key.f==="full"&&!canD("shift")&&!canD("edit"))return;r[key.f]=v}}n++})});

/* Quick Excel: only Process, User Name, Productivity % (rows on screen) */

    if(!window.ExcelJS)throw 0;const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet(String(nm).slice(0,28));
    const th={style:"thin",color:{argb:"FFB4BCC8"}},B={top:th,left:th,bottom:th,right:th},F=c=>({type:"pattern",pattern:"solid",fgColor:{argb:"FF"+c}});

    data.forEach(r=>{const x=ws.addRow(r);x.height=14;
      const a=x.getCell(1),b=x.getCell(2),c=x.getCell(3);
      a.fill=F("F2F2F2");a.font={size:10};b.fill=F("DDEBF7");b.font={bold:true,size:10,color:{argb:"FF1F3864"}};c.numFmt="0.00%";c.font={size:10};
      [a,b,c].forEach(z=>{z.border=B;z.alignment={horizontal:"center",vertical:"middle"}})});

/* dates written in a file's heading area: 2026-10-21, 10/21/2026, 21-Oct-2026, or a month like Oct-2026 */
function findDatesIn(text){
  const out={days:new Set(),months:new Set()},s=String(text||"");let m;
  const re1=/\b(20\d\d)-(\d\d)-(\d\d)\b/g;while((m=re1.exec(s)))out.days.add(`${m[1]}-${m[2]}-${m[3]}`);
  const re2=/\b(\d{1,2})\/(\d{1,2})\/(20\d\d)\b/g;while((m=re2.exec(s))){const a=+m[1],b=+m[2];const mo=a>12?b:a,dd=a>12?a:b;if(mo<=12&&dd<=31)out.days.add(`${m[3]}-${String(mo).padStart(2,"0")}-${String(dd).padStart(2,"0")}`)}
  const re3=/\b(\d{1,2})[-\s]([A-Za-z]{3})[a-z]*[-\s,]+(20\d\d)\b/g;while((m=re3.exec(s))){const mi=MONS.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mi>=0)out.days.add(`${m[3]}-${String(mi+1).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`)}
  const re4=/\b([A-Za-z]{3})[a-z]*[-\s]+(20\d\d)\b/g;while((m=re4.exec(s))){const mi=MONS.findIndex(x=>x.toLowerCase()===m[1].toLowerCase());if(mi>=0)out.months.add(`${m[2]}-${String(mi+1).padStart(2,"0")}`)}
  return out;
}

}

function fileHash(buf){const u=new Uint8Array(buf),n=Math.min(u.length,400000);let s="";for(let i=0;i<n;i+=3)s+=String.fromCharCode(u[i]);return u.length+"-"+H(s)}

function findRow(rows,re,max=40){for(let r=0;r<Math.min(rows.length,max);r++){const c=(rows[r]||[]).findIndex(v=>re.test(clean(v)));if(c>=0)return{r,c}}return null}
function sheetKind(rows){

/* portal reports (NICE "UOM Volume Summary") are HTML saved as .xls: read the big table directly */
function htmlToRows(text){
  const doc=new DOMParser().parseFromString(text,"text/html");
  const tables=[...doc.querySelectorAll("table")].filter(t=>/first\s*name|user\s*name/i.test(t.textContent));
  if(!tables.length)return null;
  const t=tables.sort((a,b)=>b.rows.length-a.rows.length)[0];
  const grid=[],occ={};
  [...t.rows].forEach((tr,ri)=>{const g=grid[ri]=grid[ri]||[];let ci=0;
    [...tr.cells].forEach(td=>{while(occ[ri+","+ci]){g[ci]="";ci++}
      const cs=Math.max(1,+td.colSpan||1),rs=Math.max(1,+td.rowSpan||1),txt=(td.querySelector("table")?"":td.textContent).replace(/\s+/g," ").trim();
      for(let k=0;k<cs;k++){g[ci+k]=k?"":txt;for(let r2=1;r2<rs;r2++)occ[(ri+r2)+","+(ci+k)]=1}ci+=cs});
  });
  return grid.map(r=>Array.from(r,v=>v??""));
}
/* names written differently still match: "ABIMELAK TONY" = "TONY,ABIMELAK" */
const nameKey=n=>String(n||"").toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(w=>w.length>1).sort().join(" ");
function findPerson(rows,name){
  const k=nameKey(name);if(!k)return null;
  let r=rows.find(x=>nameKey(x.name)===k);if(r)return r;
  const kt=k.split(" ");
  r=rows.find(x=>{const xt=nameKey(x.name).split(" ");const hit=kt.filter(w=>xt.includes(w)).length;return hit>=2||(hit===1&&kt.length===1&&xt.length===1)});
  return r||null;
}
/* Original Doc "Below Me (UOM)" report: baskets down, employees across */
function parseOriginal(rows){
  const fn=findRow(rows,/^first\s*name$/i),ln=findRow(rows,/^last\s*name$/i),tm=findRow(rows,/^team/i);
  const wb=findRow(rows,/^work\s*basket$/i,60)||{r:Math.max(fn.r,ln?ln.r:0,tm?tm.r:0),c:0};
  const hdr=[fn.r,ln?.r,tm?.r].filter(x=>x!=null);
  let totalCol=null;const people=[];
  const width=Math.max(...rows.slice(0,wb.r+3).map(r=>r.length));
  for(let c=fn.c+1;c<width;c++){
    if(hdr.some(r=>/^total$/i.test(clean(rows[r][c])))){totalCol=c;continue}
    const first=clean(rows[fn.r][c]);if(!first)continue;
    people.push({c,first,last:ln?clean(rows[ln.r][c]):"",team:tm?clean(rows[tm.r][c]):""});
  }
  if(!people.length)return{err:"No employee names found next to “First Name”."};
  const lastP=people[people.length-1].c;
  let shifted=0,totalsRow=null;const data=[];
  const rowShift=row=>{if(totalCol==null)return null;for(const s of [0,1,-1,2,3]){const tv=numVal(row[totalCol+s]);if(tv==null||!(tv>0)||clean(row[totalCol+s])==="")continue;
      const sum=people.reduce((a,p)=>a+(numVal(row[p.c+s])||0),0);if(Math.abs(sum-tv)<0.01)return s}return null};
  /* most rows of a report share one shift: vote it, then use it where a row can't prove its own */
  const votes={};for(let r=wb.r+1;r<rows.length;r++){const row=rows[r]||[];if(!clean(row[wb.c]))continue;const s=rowShift(row);if(s!=null)votes[s]=(votes[s]||0)+1}
  const gShift=+(Object.entries(votes).sort((a,b)=>b[1]-a[1])[0]||[0])[0];
  for(let r=wb.r+1;r<rows.length;r++){
    const row=rows[r]||[];const name=clean(row[wb.c]);
    if(!name){if(row.slice(fn.c+1).some(v=>numVal(v)>0)&&!totalsRow)totalsRow=row;continue}
    if(/^totals?$/i.test(name)){totalsRow=row;continue}
    let shift=rowShift(row);if(shift==null)shift=gShift;
    if(shift)shifted++;
    data.push({name,stm:numVal(row[fn.c])||numVal(row[wb.c+1]),vals:people.map(p=>numVal(row[p.c+shift])||0)});
  }
  if(!data.length)return{err:"No work basket rows found under “Work Basket”."};
  const tasks=[];data.forEach(d=>{if(!tasks.some(t=>t.k===bk(d.name)))tasks.push({k:bk(d.name),name:d.name,aht:d.stm>0?d.stm:5})});
  const guessProc=pi=>{let best=null,bv=0;data.forEach(d=>{if(d.vals[pi]/(60/(d.stm||5))>bv){bv=d.vals[pi]/(60/(d.stm||5));best=d.name}});if(!best)return "";const n=best.toLowerCase();
    return /pcrl/.test(n)?"PCRL":/pend_?52/.test(n)?"Pend52":/outreach/.test(n)?"Outreach":/non_?par/.test(n)?"NonPar":/onbase/.test(n)?"Onbase":/cpq/.test(n)?"CPQ":/cpa/.test(n)?"CPA":/dbm/.test(n)?"DBM":""};
  const out=people.map((p,pi)=>{const r={key:norm(p.first+p.last),name:(p.first+" "+p.last).replace(/\s+-$/,"").trim(),team:p.team,proc:guessProc(pi)||"DBM",c:{},dt:{},full:defFull(),lv:0,cm:""};
    data.forEach(d=>{if(d.vals[pi])r.c[bk(d.name)]=(r.c[bk(d.name)]||0)+d.vals[pi]});return r});
  const rep=[`<li>Original Doc report: ${tasks.length} work baskets, ${out.length} employees</li>`,
    shifted?`<li class="ok">${shifted} shifted rows moved back under the right employee</li>`:`<li>No shifted rows found</li>`,
    `<li>AHT taken from the STM column. 100% hours set to ${defFull()} (change in Admin or in the row)</li>`];
  const tShift=totalsRow?[gShift,0].map(sh=>[sh,people.filter((p,pi)=>Math.abs((numVal(totalsRow[p.c+sh])||0)-data.reduce((a,d)=>a+d.vals[pi],0))<0.01).length]).sort((a,b)=>b[1]-a[1])[0][0]:0;
  if(totalsRow){const bad=[];people.forEach((p,pi)=>{const want=numVal(totalsRow[p.c+tShift]);const got=data.reduce((a,d)=>a+d.vals[pi],0);if(want!=null&&clean(totalsRow[p.c+tShift])!==""&&Math.abs(want-got)>0.01)bad.push(`${p.first}: report ${want}, loaded ${got}`)});
    rep.push(bad.length?`<li class="bad">Totals mismatch for ${bad.length}: ${esc(bad.slice(0,5).join(" · "))}</li>`:`<li class="ok">Every employee total matches the report's Totals row ✓</li>`)}
  return{tasks,rows:out,rep};
}

/* Productivity sheet: Process | User Name | Count/Time pairs | Total | Downtime | … | 100% | Leaves */
function parseSummary(rows){
  const un=findRow(rows,/^user\s*name$/i,10);
  let fd=-1;for(let r=un.r+1;r<rows.length;r++){const v=clean((rows[r]||[])[un.c]);if(v&&!isNum(v)){fd=r;break}}
  if(fd<0)return{err:"No employee rows found under “User Name”."};
  const width=Math.max(...rows.slice(0,fd+1).map(r=>r.length));
  const SKIP=/^(time|total|total\s*downtime|production\s*hours?|productivity.*|no\.?\s*of\s*hours|downtime|hours)$/i;
  const map={},tasks=[];
  for(let c=0;c<width;c++){
    if(c===un.c)continue;
    const labels=rows.slice(0,fd).map(r=>clean((r||[])[c]));
    const texts=labels.filter(v=>v&&!isNum(v));if(!texts.length)continue;
    const has=re=>texts.find(v=>re.test(v.replace(/\s+/g," ")));
    if(has(/^process$/i)){map[c]={t:"proc"};continue}
    if(has(/^comments?$/i)){map[c]={t:"cm"};continue}
    if(has(/^100\s*%?$/)){map[c]={t:"f",k:"full"};continue}
    if(has(/^leaves?$/i)){map[c]={t:"f",k:"lv"};continue}
    const d=DT.find(x=>texts.some(v=>{const L=norm(v);if(/^(total)?downtime/.test(L))return false;return L===norm(lab("dt_"+x[0]))||DTA[x[0]].some(a=>L===a||(a.length>=4&&L.startsWith(a)))}));
    if(d){map[c]={t:"d",k:d[0]};continue}
    const text=texts[0];if(SKIP.test(text)||/^time/i.test(text))continue;
    const ti=labels.indexOf(text);const aht=labels.slice(ti+1).map(numVal).find(v=>v>0);if(!aht)continue;
    let k0=bk(text),k=k0,i2=1;while(tasks.some(x=>x.k===k)){i2++;k=k0+"_"+i2}const t={k,name:i2>1?text+" ("+i2+")":text,aht};tasks.push(t);
    map[c]={t:"c",k:t.k};
  }
  if(!tasks.length)return{err:"No task columns (name with AHT below it) found in this sheet."};
  const out=[];
  for(let r=fd;r<rows.length;r++){
    const row=rows[r]||[];const nm=clean(row[un.c]);if(!nm||isNum(nm))continue;
    const e={key:norm(nm),name:nm,team:"",proc:"DBM",c:{},dt:{},full:defFull(),lv:0,cm:""};
    for(const c in map){const m=map[c],raw=clean(row[c]),v=numVal(raw);
      if(m.t==="proc"){if(raw){e.proc=raw;e.team=raw}}
      else if(m.t==="cm")e.cm=raw;
      else if(m.t==="c"){if(v>0)e.c[m.k]=v}
      else if(m.t==="d"){if(v>0)e.dt[m.k]=v}
      else if(m.t==="f"){if(raw!==""&&v!==null)e[m.k]=v}}
    out.push(e);
  }
  const hasFull=Object.values(map).some(m=>m.k==="full");
  return{tasks,rows:out,rep:[`<li>Productivity sheet: ${tasks.length} task columns with their AHT, ${out.length} employees</li>`,
    `<li>Downtime, ${hasFull?"100% hours, ":""}leaves and comments taken from the sheet</li>`,
    `<li class="ok">Time, Total, Production Hours and Productivity worked out with the sheet's formulas</li>`]};
}

function exportMonth(ym,arr){

function qFix(q){q=q||qFresh();q.cfg=Object.assign(qFresh().cfg,q.cfg||{});q.months=q.months||{};
  q.cfg.grades=(q.cfg.grades||[]).map(String).filter(Boolean);if(!q.cfg.grades.length)q.cfg.grades=["22"];

function qMerge(a,b){
  a=qFix(clone(a));b=qFix(clone(b));const out=(b.cfg.at||0)>(a.cfg.at||0)?b:a,other=out===b?a:b;
  Object.entries(other.months).forEach(([ym,m])=>{const o=out.months[ym]=out.months[ym]||{rows:{}};o.rows=o.rows||{};

function qLine(p,M,teamPct){

const CF=()=>DT.map(([k])=>"dt_"+k).concat(["lv","cm","full"]);

const cfAdd=f=>f.startsWith("dt_")||f==="lv";
const cfOn=f=>!!(S.cfg.carry&&S.cfg.carry.on!==false&&S.cfg.carry.f&&S.cfg.carry.f[f]);
const cfGet=(r,f)=>f.startsWith("dt_")?r.dt[f.slice(3)]:r[f];
const cfPv=(r,f)=>+((r.pv||{})[f])||0;
function cfSetPv(r,f,v){v=+(+v).toFixed(4);r.pv=r.pv||{};if(v)r.pv[f]=v;else delete r.pv[f];if(!Object.keys(r.pv).length)delete r.pv}
function cfSet(r,f,v){v=+(+v||0).toFixed(4);if(f.startsWith("dt_")){if(v)r.dt[f.slice(3)]=v;else delete r.dt[f.slice(3)]}else r[f]=v}

/* rows: today's rows · prev: {d,day} · oldFor(r): the same person on the date being replaced · oldCv: that date already used carry forward */
function carryRows(rows,prev,oldFor,oldCv){
  let n=0;
  rows.forEach(r=>{const p=prev&&findPerson(prev.day.rows,r.name),o=oldFor?oldFor(r):null;
    CF().forEach(f=>{if(!cfOn(f))return;
      if(cfAdd(f)){const prevT=p?(+cfGet(p,f)||0):0;let today;
        if(o){const tot=+cfGet(o,f)||0;today=oldCv?tot-cfPv(o,f):Math.max(0,tot-prevT)}   /* an older date typed by hand keeps its total */
        else today=+cfGet(r,f)||0;
        cfSetPv(r,f,prevT);cfSet(r,f,prevT+today);if(prevT)n++}
      else if(p){
        if(f==="cm"){const own=o?o.cm:r.cm;if(!own&&p.cm){r.cm=p.cm;n++}}
        else if(f==="full"&&+p.full>0){r.full=p.full;n++}}
    })});
  return n;
}

async function buildStyled(d){

  const F=c=>({type:"pattern",pattern:"solid",fgColor:{argb:"FF"+c}});
  const AL={horizontal:"center",vertical:"middle",wrapText:true};
  const W={bold:true,color:{argb:"FFFFFFFF"},size:10,name:"Calibri"},K={bold:true,color:{argb:"FF14243A"},size:10,name:"Calibri"};
  const box=(r1,c1,r2,c2,v,fill,font)=>{for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){const x=ws.getCell(r,c);x.border=BOX;x.fill=F(fill);x.font=font;x.alignment=AL}
    if(r1!==r2||c1!==c2)ws.mergeCells(r1,c1,r2,c2);ws.getCell(r1,c1).value=v};
  const L=c=>ws.getColumn(c).letter;
  box(1,1,3,1,lab("proc"),"9DC3E6",K);box(1,2,3,2,lab("emp"),"F47B20",W);
  let c=3;const cols=[];
  T.forEach(t=>{box(1,c,1,c,t.name,"1F4E79",W);box(1,c+1,3,c+1,lab("time"),"1F4E79",W);
    box(2,c,2,c,t.aht,"1F4E79",W);box(3,c,3,c,t.ph>0?t.ph:{formula:`60/${L(c)}2`,result:60/t.aht},"1F4E79",W);ws.getCell(3,c).numFmt="0.00";
    cols.push({t,cc:c,tc:c+1});c+=2});
  const totC=c++;box(1,totC,3,totC,lab("total"),"F47B20",W);
  const dt0=c;box(1,dt0,1,dt0+DT.length,lab("dt"),"F47B20",W);
  DT.forEach(([k])=>{box(2,c,3,c,lab("dt_"+k),"F47B20",W);c++});
  const tdtC=c++;box(2,tdtC,3,tdtC,lab("tdt"),"F47B20",W);
  const prodC=c++,pctC=c++,cmC=c++,fullC=c++,lvC=c++,nohC=c++;
  [[prodC,"prod"],[pctC,"pct"],[cmC,"cm"],[fullC,"full"],[lvC,"lv"],[nohC,"noh"]].forEach(([cc,k])=>box(1,cc,3,cc,lab(k),cc>=fullC?"C55A11":"F47B20",W));
  const div=S.cfg.dtUnit==="min"?"/60":"";
  rowsX.forEach((r,i)=>{const R=4+i,x=calc(r,D.tasks);
    const cell=(cc,v,fill,fmt,font)=>{const e=ws.getCell(R,cc);e.value=v;e.border=BOX;if(fill)e.fill=F(fill);if(fmt)e.numFmt=fmt;e.font=font||{size:10,name:"Calibri"};e.alignment={horizontal:cc<=2?"left":"center",vertical:"middle"};return e};
    cell(1,r.proc,"D9E5F2",null,K);cell(2,r.name,"2F55A4",null,W);
    cols.forEach(({t,cc,tc})=>{const n=r.c[t.k];cell(cc,n>0?n:null,"C6EFCE");cell(tc,{formula:`IFERROR(${L(cc)}${R}/${L(cc)}$3,0)`,result:+(x.times[t.k]||0).toFixed(4)},"C6EFCE","0.00")});
    cell(totC,{formula:cols.length?`SUM(${cols.map(o=>L(o.tc)+R).join(",")})`:"0",result:+x.total.toFixed(4)},"FCE4D6","0.00",K);
    DT.forEach(([k],j)=>cell(dt0+j,r.dt[k]>0?r.dt[k]:null,"E6B8F0"));
    cell(tdtC,{formula:`SUM(${L(dt0)}${R}:${L(dt0+DT.length-1)}${R})${div}`,result:+x.dtHr.toFixed(4)},"FFFFFF","0.00");
    cell(fullC,r.full??null,"FFFFFF");cell(lvC,r.lv||null,"FFFFFF");
    cell(nohC,{formula:`${L(fullC)}${R}-${L(lvC)}${R}`,result:x.hours},"FFFFFF","0.00");
    cell(prodC,{formula:`${L(nohC)}${R}-${L(tdtC)}${R}`,result:+x.prod.toFixed(4)},"FFFFFF","0.00",K);
    cell(pctC,{formula:`IFERROR(${L(totC)}${R}/${L(prodC)}${R},0)`,result:+(x.pct/100).toFixed(6)},x.pct>=S.cfg.g?"C6EFCE":x.pct>=S.cfg.a?"FFEB9C":"FFC7CE","0.00%",K);
    cell(cmC,r.cm||null,"FFFFFF");
  });
  if(S.cfg.wm!==false){const R=4+rowsX.length+1;ws.getCell(R,2).value="Confidential · "+me.pc+" · "+new Date().toLocaleString("en-IN");ws.getCell(R,2).font={italic:true,size:9,color:{argb:"FF7F93A8"}};ws.headerFooter={oddFooter:"&LConfidential · "+me.pc+"&R&D &T"}}
  ws.getColumn(1).width=11;ws.getColumn(2).width=28;
  for(let k=3;k<c;k++)ws.getColumn(k).width=k>=dt0?11:10;ws.getColumn(cmC).width=22;
  ws.getRow(1).height=44;ws.getRow(2).height=30;ws.getRow(3).height=18;

  return{buf:await wb.xlsx.writeBuffer(),fname:"Eclipse_"+view.proc+"_"+d+".xlsx"};
}
function visTasksFor(d){const D=S.days[d];const on=D.tasks.filter(t=>D.rows.some(r=>+r.c[t.k]>0));return view.active&&on.length?on:D.tasks}
function saveBlob(blob,fname){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function styledExport(d,share){
  if(!d)return;
  if(!window.ExcelJS){exportDates([d]);return}
  try{
    toast(share?"Preparing file to share…":"Preparing Excel…");
    const {buf,fname}=await buildStyled(d);
    const type="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",blob=new Blob([buf],{type});
    if(share){
      const file=new File([blob],fname,{type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:"Alpha NextGen Eclipse · "+fmtD(d)});toast("Shared");return}catch(e){if(e&&e.name==="AbortError")return}
      }
      saveBlob(blob,fname);toast("Downloaded "+fname+". Attach it in Outlook or Teams to share.");return;
    }
    saveBlob(blob,fname);toast("Exported "+fname);
  }catch(e){exportDates([d])}
}

function sheetRows(d){

  const head=[lab("proc"),lab("emp"),"Team",...T.flatMap(t=>[t.name+" (AHT "+t.aht+")",lab("time")]),lab("total"),...DT.map(x=>lab("dt_"+x[0])),lab("tdt"),lab("prod"),lab("pct"),lab("cm"),lab("full"),lab("lv"),lab("noh")];
  const n=v=>+f2(v);const out=[head];
  rowsFiltered().map(x=>x.r).forEach(r=>{const c=calc(r,D.tasks);out.push([r.proc,r.name,r.team,...T.flatMap(t=>[r.c[t.k]??"",n(c.times[t.k])]),n(c.total),...DT.map(([k])=>r.dt[k]??""),n(c.dtHr),n(c.prod),+(c.pct/100).toFixed(4),r.cm||"",r.full??"",r.lv??"",n(c.hours)])});

function exportDates(ds){
  if(!ds.length)return;
  const fname="Eclipse_"+view.proc+"_"+(ds.length===1?ds[0]:ds[0].slice(0,7)+"_month");
  try{
    if(typeof XLSX==="undefined")throw 0;
    const wb=XLSX.utils.book_new();
    ds.forEach(d=>{const {head,out}=sheetRows(d);const ws=XLSX.utils.aoa_to_sheet(out);
      ws["!cols"]=head.map((h,i)=>({wch:i<3?26:Math.max(9,Math.min(34,String(h).length+2))}));
      const pc=head.indexOf(lab("pct"));for(let r=1;r<out.length;r++){const a=XLSX.utils.encode_cell({r,c:pc});if(ws[a])ws[a].z="0.00%"}
      ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:out.length-1,c:head.length-1}})};
      XLSX.utils.book_append_sheet(wb,ws,fmtD(d).slice(0,11))});
    XLSX.writeFile(wb,fname+".xlsx");
  }catch(e){
    const csv=ds.map(d=>{const {out}=sheetRows(d);return [[fmtD(d)],...out].map(r=>r.map(v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\r\n")}).join("\r\n\r\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download=fname+".csv";document.body.appendChild(a);a.click();a.remove();
  }
  toast(ds.length===1?"Exported "+fmtD(ds[0]):"Exported "+ds.length+" dates of "+fmtMonth(ds[0].slice(0,7))+", one sheet per date");
}

  const pwCell=(u,i)=>!u.msid?`<span class="muted">PC last 4</span>`:(ADF.pws&&ADF.pws[u.msid]&&ADF.pws[u.msid].h)?`<span class="okb">✓ set</span>${ADF.pws[u.msid].dev?` <button class="cap sm" data-uul="${i}" title="Locked to one PC. Unlock to let them log in on another PC">🔒 Unlock PC</button>`:""} <button class="cap sm" data-urs="${i}" title="User sets a new one with MSID + PC number">Reset</button>`:`<span class="muted">not set yet</span>`;
  const body=rows.map(({u,i})=>`<tr class="${ADF.sel.has(uid(u))?"sel":""}"><td class="s0"><input type="checkbox" data-us="${esc(uid(u))}" ${ADF.sel.has(uid(u))?"checked":""}></td>

  const U=$("#uTable");
  U.onclick=e=>{const t=e.target;
    const pu=t.closest("[data-pu]");if(pu){const u=AD.users[+pu.dataset.pu],f=pu.dataset.f;u.ov=u.ov||{};const o=u.ov[f];if(o==null)u.ov[f]=1;else if(o===1)u.ov[f]=0;else delete u.ov[f];if(!Object.keys(u.ov).length)delete u.ov;adChanged();pcTable();return}
    const pp=t.closest("[data-pp]");if(pp){const u=AD.users[+pp.dataset.pp],PR=AD.procs&&AD.procs.length?AD.procs:PROC0;if(!Array.isArray(u.procs))u.procs=PR.filter(p=>(p.roles||{})[u.role]!==0&&p.status!=="hidden").map(p=>p.k);const k=pp.dataset.p;u.procs=u.procs.includes(k)?u.procs.filter(x=>x!==k):u.procs.concat(k);adChanged();pcTable();return}
    const ul=t.closest("[data-uul]");if(ul){const u=AD.users[+ul.dataset.uul];ask(null,"Unlock "+esc(u.msid)+" from its PC?","They keep their password. The next PC they log in on becomes their PC.","Unlock",async()=>{const e=(await pwsLoad())[u.msid];await pwsSet(u.msid,e&&e.h,null);ADF.pws=await pwsLoad();pcTable();toast(u.msid+" unlocked")});return}
    const rs=t.closest("[data-urs]");if(rs){const u=AD.users[+rs.dataset.urs];ask(null,"Reset the password of "+esc(u.msid)+"?","They set a new one on the login screen with their MSID and PC number (“First time, or forgot your password?”).","Reset password",async()=>{await pwsSet(u.msid,null);ADF.pws=await pwsLoad();pcTable();toast("Password reset for "+u.msid)},true);return}
    const pr=t.closest("[data-ppr]");if(pr){delete AD.users[+pr.dataset.ppr].procs;adChanged();pcTable();return}
    const ud=t.closest("[data-ud]");if(ud){const u=AD.users[+ud.dataset.ud];ask(null,"Remove "+esc(uid(u))+"?","This PC loses its role and custom access.","Remove",()=>{AD.users.splice(+ud.dataset.ud,1);ADF.sel.delete(uid(u));adChanged();pcTable()},true);return}
  };
  U.onchange=e=>{const t=e.target,d=t.dataset;
    if(t.id==="uAll"){userRows().forEach(({u})=>t.checked?ADF.sel.add(uid(u)):ADF.sel.delete(uid(u)));pcTable();return}
    if(d.us!=null){t.checked?ADF.sel.add(d.us):ADF.sel.delete(d.us);t.closest("tr").classList.toggle("sel",t.checked);$("#uSelN").textContent=ADF.sel.size+" selected";return}

  };

function fixCfg(){
  const c=S.cfg;c.users=Array.isArray(c.users)?c.users:[];
  if(!c.users.length)c.seedV=0;   /* an empty user list is never wanted: bring the PCIS team back */
  /* one time: add the PCIS team and the new access (Data Entry = everything, others = view) */
  if((+c.seedV||0)<2){
    SEED_USERS.forEach(s=>{const o=c.users.find(u=>(u.msid&&u.msid===s.msid)||(u.pc&&u.pc===s.pc));if(o)Object.assign(o,{msid:s.msid,opid:s.opid,pc:s.pc,role:s.role,name:s.name,team:s.team});else c.users.push(clone(s))});
    c.perms=clone(DEFPERM);c.scope=clone(DEFSCOPE);c.users.forEach(u=>{delete u.ov;delete u.scope});c.seedV=2;
  }
  c.perms=c.perms||{};if(c.perms.manager&&!c.perms.sme)c.perms.sme=clone(c.perms.manager);
  if(c.scope&&c.scope.manager&&!c.scope.sme)c.scope.sme=c.scope.manager;
  c.deff=c.deff||{};
  /* carry forward: which headings come from the last saved date of the month (Admin, page 2) */
  if(!c.carry||typeof c.carry!=="object")c.carry={on:true,f:{}};
  if(!c.carry.f||!Object.keys(c.carry.f).length){c.carry.f={};DT.forEach(([k])=>c.carry.f["dt_"+k]=1);c.carry.f.lv=1;c.carry.f.cm=0;c.carry.f.full=0}
  if(c.carry.on===undefined)c.carry.on=true;
  ROLE3.forEach(r=>c.perms[r]=Object.assign({},DEFPERM[r],c.perms[r]||{}));
  c.scope=Object.assign({},DEFSCOPE,c.scope||{});c.msg=Object.assign({},c.msg||{});c.lab=c.lab||{};c.fon=c.fon||{};
  /* older "screen parts" switches become global feature switches */
  if(c.ui){Object.entries(c.ui).forEach(([k,v])=>{if(v===false)c.fon[k]=false});delete c.ui}
  c.procs=clone(PROC0);   /* only PCIS */
  c.procs.forEach(p=>{p.roles=Object.assign({entry:1,manager:1,sme:1,employee:1},p.roles||{});p.label=p.label||p.k;p.status=p.status||"soon"});
  if(c.exp&&c.exp<"2027-03-31")c.exp=null;
  c.notice=c.notice||{on:false,text:"",type:"info",speed:25};c.tgt=c.tgt||{};c.aht=c.aht||{};
  (c.pcsAdd||[]).forEach(p=>{if(!c.users.some(u=>u.pc===p)&&!isBuiltInAdmin(p))c.users.push({pc:p,role:"employee",name:"",team:""})});c.pcsAdd=[];
}

  let c={msid:col("msid","userid","user"),opid:col("opid","code"),pc:col("devicename","device","pc","pcnumber","computer"),role:col("role"),name:col("name","employeename","username"),team:col("team","manager"),till:col("validtill","valid","expiry")};
  let body=rows.slice(1);
  if(c.msid<0){c={msid:0,opid:1,pc:2,role:3,name:4,team:5,till:6};body=rows}   /* no header: use your Excel's column order */
  const roleOf=v=>{v=norm(v);return v.startsWith("adm")?"admin":v.startsWith("data")||v.startsWith("ent")?"entry":v.startsWith("sme")?"sme":v.startsWith("man")||v.startsWith("tl")?"manager":"employee"};
  const dateOf=v=>{v=String(v||"").trim();if(!v)return "";let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return +m[1]>=9000?"":`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
    m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;if(y>=9000)return "";const a=+m[1],b=+m[2],mo=a>12?b:a,d=a>12?a:b;return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
    const t=Date.parse(v);if(!isNaN(t)){const dt=new Date(t);return dt.getFullYear()>=9000?"":new Date(t-dt.getTimezoneOffset()*6e4).toISOString().slice(0,10)}return ""};
  const g=(r,k)=>c[k]>=0?String(r[c[k]]??"").trim():"";
  let add=0,upd=0,seen=new Set();const bad=[];
  body.forEach(r=>{const msid=g(r,"msid").toLowerCase(),pc=g(r,"pc").toUpperCase().replace(/\..*$/,"");
    if(!msid&&!pc)return;if(seen.has(msid||pc))return;seen.add(msid||pc);
    if(isBuiltInAdmin(msid)||isBuiltInAdmin(pc)){bad.push(msid||pc);return}
    const rec={msid,opid:g(r,"opid").toUpperCase(),pc,role:roleOf(g(r,"role")),name:g(r,"name"),team:g(r,"team")},till=dateOf(g(r,"till"));
    const o=AD.users.find(u=>(msid&&u.msid===msid)||(pc&&u.pc===pc));
    if(o){Object.assign(o,rec);if(till)o.until=till;else delete o.until;upd++}else{if(till)rec.until=till;AD.users.push(rec);add++}});
  adChanged();openAdmin(1);toast(`Imported: ${add} new, ${upd} updated${bad.length?" · skipped "+bad.join(", "):""}. Click Save & apply.`);
}

</script>
