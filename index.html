<style>

#dump{height:44px}.dump{padding:10px 14px}.dump h3{margin-bottom:4px}
.two{display:flex;gap:6px}.two select:first-child{flex:0 0 42%}

function mapCols(hdr,tg){const used=new Set(),map=hdr.map(()=>-1),T=tg.map(nz);
 hdr.forEach((x,j)=>{const a=nz(x);if(!a)return;const i=T.findIndex((t,i)=>t===a&&!used.has(i));if(i>=0){map[j]=i;used.add(i)}});
 hdr.forEach((x,j)=>{if(map[j]>=0)return;const a=nz(x);if(a.length<6)return;const i=T.findIndex((t,i)=>!used.has(i)&&t.length>=6&&(t.includes(a)||a.includes(t))&&Math.min(a.length,t.length)/Math.max(a.length,t.length)>=0.7);if(i>=0){map[j]=i;used.add(i)}});
 return map}
function hdrScore(rows,p){const tg=D.h[p].slice();tg[tg.length-1]="";let best={n:0,i:-1,map:null};
 rows.slice(0,6).forEach((r,i)=>{const m=mapCols(r,tg),n=m.filter(x=>x>=0).length;if(n>best.n)best={n,i,map:m}});return best}
function ingest(txt,mode){if(!txt.trim())return toast("Paste some data first");let rows=parse(txt);
 const me=hdrScore(rows,cur);let other=null;
 PR.forEach((x,p)=>{if(p===cur)return;const s=hdrScore(rows,p);if(s.n>(other?other.n:0))other={p,n:s.n}});
 if(other&&other.n>=4&&other.n>=2*me.n)return toast("This looks like "+PR[other.p].n+" data ("+other.n+" headers match) - open "+PR[other.p].n+" and paste there");
 let mapped=null,skipped=[];
 if(me.n>=2){mapped=me.map;rows[me.i].forEach((x,j)=>{if(x.trim()&&mapped[j]<0)skipped.push(x.trim())});rows=rows.slice(me.i+1)}
 cf=[];if(mode==="replace")D.d[cur]=[];
 const r0=mode==="cursor"?pos.r:0,c0=mode==="cursor"?pos.c:0,nc=NC()-1;
 while(D.d[cur].length<r0+rows.length)D.d[cur].push(blank());
 rows.forEach((row,i)=>row.forEach((v,j)=>{const c=mapped?mapped[j]:c0+j;if(c>=0&&c<nc)D.d[cur][r0+i][c]=v.trim()}));
 pad(cur);save();render();
 toast(rows.length+" rows loaded"+(mapped?" • "+me.n+" columns matched by header"+(skipped.length?" • skipped: "+skipped.slice(0,3).join(", ")+(skipped.length>3?"...":""):""):" • no header found - pasted by position from column "+(c0+1)))}
$("tb").addEventListener("paste",e=>{if(e.target.classList.contains("h")||e.target.classList.contains("cf"))return;e.preventDefault();ingest((e.clipboardData||window.clipboardData).getData("text"),"cursor")});
$("dump").addEventListener("input",()=>{const v=$("dump").value.trim();$("dinfo").textContent=v?parse(v).length+" lines pasted":""});
$("bLoad").onclick=()=>{const t=$("dump").value;if(!t.trim())return toast("Paste some data first");ingest(t,"replace");$("dump").value="";$("dinfo").textContent=""};
$("bDclr").onclick=()=>{$("dump").value="";$("dinfo").textContent=""};
$("bClrS").onclick=function(){arm(this,()=>{D.d[cur]=[];pad(cur);LR=null;$("res").style.display="none";save();render();toast("Sheet cleared")})};
$("eraseAll").onclick=function(){arm(this,clearAll)};
function clearAll(){D.d[cur]=[];pad(cur);cf=[];LR=null;mq=[];selIds=new Set();
 $("dump").value="";$("f0").value="";$("f1").value="";$("f8").value="";$("pct").value="5";$("dinfo").textContent="";
 gb="total";[...$("seg").children].forEach((x,i)=>x.classList.toggle("on",i===0));["dcol","dval","ncol","nval"].forEach(i=>$(i).innerHTML="");
 $("res").style.display="none";save();render();toast("Cleared - fresh page")}
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pctv=()=>Math.max(0.1,Math.min(100,parseFloat($("pct").value)||5));
var gb="total",LRt="";
const take=(n,p)=>Math.min(n,Math.max(1,Math.round(n*p/100)));
const dsort=(a,b)=>{const x=Date.parse(a),y=Date.parse(b);return(isNaN(x)||isNaN(y))?a.localeCompare(b):x-y};
const colVals=(c,f)=>[...new Set(D.d[cur].filter(r=>r[KC()]!=="").map(r=>r[c]).filter(x=>x!==""))].sort(f);
function scopes(){const kc=KC(),dc=+$("dcol").value,dv=$("dval").value,cl=D.d[cur].filter(r=>r[kc]!=="");
 if(dv==="*"){const g={};cl.forEach(r=>{const d=r[dc];if(d!=="")(g[d]=g[d]||[]).push(r)});return Object.keys(g).sort(dsort).map(d=>({d,rows:g[d]}))}
 return[{d:dv,rows:dv?cl.filter(r=>r[dc]===dv):cl}]}
function plan(){const nc=+$("ncol").value,nv=$("nval").value,own=gb==="own",p=pctv(),dv=$("dval").value,G=[];
 scopes().forEach(sc=>{const names=nv?[nv]:[...new Set(sc.rows.map(r=>r[nc]).filter(x=>x!==""))].sort();let ks=0;
  names.forEach(n=>{const base=own?sc.rows.filter(r=>r[nc]===n):sc.rows;if(!base.length)return;const k=take(base.length,p);ks+=k;G.push({name:n,key:n+(dv==="*"?" · "+sc.d:""),base,k,sc})});
  if(!own&&ks>sc.rows.length)G.over=true});
 return G}
function prev(){const G=plan();let n=0;G.forEach(g=>n+=g.k);
 $("pv").textContent=G.length?"≈ "+n+" records will be picked • "+G.length+" group"+(G.length>1?"s":"")+(G.over?" • pool is smaller than requested":""):""}
function fillG(){const h=H().slice(0,-1);
 const opt=(id,def)=>{const el=$(id),o=el.value;el.innerHTML=h.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join("");el.value=(o!==""&&h[+o]!==undefined)?o:def};
 opt("dcol",P().dt);opt("ncol",P().nm);
 const fv=(id,first,vals)=>{const el=$(id),o=el.value;el.innerHTML=first+vals.slice(0,1000).map(x=>`<option>${esc(x)}</option>`).join("");el.value=o;if(el.selectedIndex<0)el.value=""};
 fv("dval","<option value=''>All dates (combined)</option><option value='*'>Each date separately</option>",colVals(+$("dcol").value,dsort));
 fv("nval","<option value=''>All names</option>",colVals(+$("ncol").value));
 prev()}
$("seg").onclick=e=>{const b=e.target.closest("[data-b]");if(!b)return;gb=b.dataset.b;[...$("seg").children].forEach(x=>x.classList.toggle("on",x===b));prev()};
$("dcol").onchange=()=>{$("dval").value="";fillG()};$("ncol").onchange=()=>{$("nval").value="";fillG()};
$("dval").onchange=prev;$("nval").onchange=prev;$("pct").addEventListener("input",prev);
function summary(){if(!LR||!LR.length){$("res").style.display="none";return}
 const kc=KC(),ac=AC(),as=LR.reduce((t,x)=>t+x.n,0),tot=LR.reduce((t,x)=>t+x.total,0),mx=Math.max(...LR.map(x=>x.n),1),r=$("res");
 selIds=new Set(LR.flatMap(x=>x.ids));mq=[...new Set(D.d[cur].filter(x=>x[kc]!==""&&selIds.has(x[kc])&&x[ac]!=="").map(x=>x[ac]))];
 r.style.display="block";
 r.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:6px"><div class="sec" style="margin:0">📊 ${esc(P().n)} Result${esc(LRt)} - ${as} picked • ${LR.length} group${LR.length>1?"s":""}</div><button class="g2" id="rMail">✉ Mail</button></div>`+LR.map(x=>`<div class="bar"><span>${esc(x.key)}</span><div><u style="width:${x.n/mx*100}%"></u></div><b>${x.n} / ${x.total}</b></div><p class="ids">${esc(x.ids.slice(0,30).join(", "))}${x.ids.length>30?" ... +"+(x.ids.length-30)+" more":""}</p>`).join("")}
function run(){const G=plan();if(!G.length)return toast("No records for this selection");
 const ac=AC(),kc=KC(),own=gb==="own",dv=$("dval").value,nv=$("nval").value,p=pctv(),names=new Set(G.map(g=>g.name));
 LRt=(dv&&dv!=="*"?" • "+dv:"")+(own?" • own claims":" • of total");
 if(!nv&&!dv)D.d[cur].forEach(r=>r[ac]="");else G.forEach(g=>g.sc.rows.forEach(r=>{if(names.has(r[ac]))r[ac]=""}));
 const pools=new Map();
 LR=G.map(g=>{let pick;
  if(own)pick=shuf(g.base.filter(r=>r[ac]==="")).slice(0,g.k);
  else{if(!pools.has(g.sc))pools.set(g.sc,shuf(g.sc.rows.filter(r=>r[ac]==="")));const pl=pools.get(g.sc);pick=[];while(pick.length<g.k&&pl.length)pick.push(pl.pop())}
  pick.forEach(r=>r[ac]=g.name);return{key:g.key,total:g.base.length,n:pick.length,ids:pick.map(r=>r[kc])}});
 save();render();summary();toast("Picked "+LR.reduce((t,x)=>t+x.n,0)+" records ("+p+"%)"+(G.over?" • pool was smaller than requested":""))}
$("bRes").onclick=run;$("pct").addEventListener("keydown",e=>{if(e.key==="Enter")run()});
$("bUnas").onclick=()=>{D.d[cur].forEach(r=>r[AC()]="");LR=null;save();render();$("res").style.display="none";toast("Assignments cleared")};
async function saveFile(name,data,mime){let dl=null;try{dl=window.claude?await claude.use("downloads"):null}catch(e){}
 if(dl){try{await dl.save({filename:name,data});return true}catch(e){if(!e||e.code!=="declined")toast("Export failed: "+((e&&(e.message||e.code))||""));return false}}
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:mime||"text/plain"}));a.download=name;document.body.appendChild(a);a.click();a.remove();return true}catch(e){toast("Download unavailable");return false}}
const csvOf=rows=>{const q=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return "\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")};
const fn=s=>P().n.replace(/\W+/g,"")+"_"+s+"_"+today()+".csv";
function selRows(){return [...$("tb").querySelectorAll("tbody tr")].filter(t=>t.style.display!=="none").map(t=>D.d[cur][+t.dataset.r]).filter(rowHas)}
$("bExpR").onclick=async()=>{const rows=[H(),...selRows()];if(rows.length<2)return toast("No data to export");
 if(await saveFile(fn("Data"),csvOf(rows),"text/csv"))toast("Exported "+(rows.length-1)+" rows")};
$("bEm").onclick=()=>{const b=$("empBox");b.style.display=b.style.display==="none"?"block":"none";$("emTa").value=Object.values(D.em).map(v=>v.n+"\t"+v.e).join("\n")};
$("emSave").onclick=()=>{const m={};let n=0;$("emTa").value.split(/\r?\n/).forEach(l=>{const p=l.split(/\t|,/).map(x=>x.trim());if(p.length>=2&&p[0]&&/@/.test(p[1])){m[nk(p[0])]={n:p[0],e:p[1]};n++}});D.em=m;save();$("emInfo").textContent=n+" emails saved";toast(n+" emails saved")};
function mailPack(){const d=D.d[cur],h=H(),ac=AC(),kc=KC(),cols=[ac,...h.map((_,i)=>i).filter(i=>i!==ac)],set=new Set(mq),
 rows=d.filter(r=>r[kc]!==""&&selIds.has(r[kc])&&set.has(r[ac])).sort((a,b)=>mq.indexOf(a[ac])-mq.indexOf(b[ac])),
 to=mq.map(n=>D.em[nk(n)]).filter(Boolean).map(v=>v.e),
 body=(mq.length>1?"Hello Everyone,":"Hello "+mq[0]+",")+"\n\nBelow are the assignments:\n\n"+mq.join("\n")+"\n\nDetails are in the attached Excel.\n\nThank you";
 return{to,rows:[cols.map(c=>h[c]),...rows.map(r=>cols.map(c=>r[c]))],body,miss:mq.length-to.length}}
async function mailAll(){if(!mq.length)return;const k=mailPack();
 const ok=await saveFile(fn("Assignments"),csvOf(k.rows),"text/csv");
 location.href="mailto:"+k.to.join(",")+"?subject="+encodeURIComponent(P().n+" - Assignment")+"&body="+encodeURIComponent(k.body);
 toast((ok?"Excel downloaded - attach it to the mail":"Mail draft opened")+(k.to.length?(k.miss?" • "+k.miss+" without email":""):" • no emails on file (📇 Emails)"))}
$("res").addEventListener("click",e=>{if(e.target.closest("#rMail"))mailAll()});
$("bSave").onclick=()=>{save();toast("Data saved - it will be here when you reopen")};
addEventListener("beforeunload",()=>save());
$("bTheme").onclick=()=>{const r=document.documentElement,l=getComputedStyle(r).getPropertyValue("--bg").trim()==="#eef1ff";r.dataset.theme=l?"dark":"light"};
stamp();{const L=window.__lic,dl=Math.max(0,Math.ceil((L.end-L.now)/864e5));$("lic").textContent="🔑 Valid till "+EXPIRY.split("-").reverse().join(".")+" • "+dl+" days left"}
render();
