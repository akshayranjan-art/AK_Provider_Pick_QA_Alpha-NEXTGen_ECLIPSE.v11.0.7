<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Provider Pick QA · Alpha NextGen Eclipse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;--f-num:"JetBrains Mono",Consolas,monospace;
  --bg:#060a14;--bg2:#0a1122;--panel:#0f172b;--panel2:#131d35;--glass:rgba(15,23,43,.72);--cell:#0c1426;
  --line:rgba(148,163,209,.14);--line2:rgba(148,163,209,.26);--ink:#eaf0fb;--muted:#8d99b8;--dim:#5d6886;
  --gold:#e6bb62;--gold2:#f7dc98;--gold-soft:rgba(230,187,98,.13);
  --em:#2fd27a;--em-soft:rgba(47,210,122,.13);--teal:#34d1c4;--violet:#9686ff;--violet-soft:rgba(150,134,255,.14);
  --danger:#f4646a;--danger-soft:rgba(244,100,106,.13);--amber:#f6ad3c;
  --hdr:#16223f;--shadow:0 18px 50px rgba(0,0,0,.45);--ring:0 0 0 3px rgba(230,187,98,.28);
}
:root[data-theme="light"]{
  --bg:#eef1f8;--bg2:#e6eaf4;--panel:#ffffff;--panel2:#f7f9fd;--glass:rgba(255,255,255,.82);--cell:#ffffff;
  --line:#dfe4ef;--line2:#cbd3e4;--ink:#0e1730;--muted:#5a6684;--dim:#8a94ad;
  --gold:#b07d1f;--gold2:#8a5f0f;--gold-soft:rgba(176,125,31,.1);
  --em:#13a35a;--em-soft:rgba(19,163,90,.1);--teal:#0f9d92;--violet:#5b4bd8;--violet-soft:rgba(91,75,216,.09);
  --danger:#d43c44;--danger-soft:rgba(212,60,68,.09);--amber:#c9790c;
  --hdr:#14213f;--shadow:0 14px 40px rgba(20,33,63,.12);--ring:0 0 0 3px rgba(176,125,31,.22);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 85% -10%,rgba(150,134,255,.10),transparent 60%),
  radial-gradient(900px 500px at -10% 10%,rgba(230,187,98,.07),transparent 60%),var(--bg);background-attachment:fixed}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:8px 12px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:var(--ring)}
textarea{resize:vertical}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--f-num)}
.muted{color:var(--muted)}

/* ---------- capsule buttons ---------- */
.cap{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:9px 18px;border:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0)),var(--panel2);font-weight:650;font-size:13px;letter-spacing:.01em;cursor:pointer;
  transition:transform .15s,box-shadow .2s,border-color .2s,background .2s;white-space:nowrap;user-select:none;position:relative}
.cap:hover{transform:translateY(-1px);border-color:var(--gold);box-shadow:0 8px 22px rgba(0,0,0,.22)}
.cap:active{transform:translateY(0)}
.cap:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.cap.sm{padding:6px 13px;font-size:12px}.cap.xs{padding:3px 10px;font-size:11px}
.cap.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#c48f2c);color:#1b1306;border-color:transparent;box-shadow:0 6px 18px rgba(230,187,98,.28)}
:root[data-theme="light"] .cap.gold{color:#fff;background:linear-gradient(135deg,#d3a240,#b07d1f 60%,#8a5f0f)}
.cap.em{background:linear-gradient(135deg,#4be59a,#1fb866);color:#04210f;border-color:transparent;box-shadow:0 6px 18px rgba(47,210,122,.25)}
.cap.violet{background:linear-gradient(135deg,#b2a6ff,#7c6cf0);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(150,134,255,.25)}
.cap.danger{color:var(--danger);border-color:rgba(244,100,106,.45);background:var(--danger-soft)}
.cap.ghost{background:transparent}
.cap.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold2)}
:root[data-theme="light"] .cap.on{color:var(--gold2)}
.cap .ic{font-size:14px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:650;border:1px solid var(--line2);background:var(--panel2);color:var(--muted)}
.chip.gold{color:var(--gold2);border-color:rgba(230,187,98,.4);background:var(--gold-soft)}
:root[data-theme="light"] .chip.gold{color:var(--gold2)}
.chip.em{color:var(--em);border-color:rgba(47,210,122,.4);background:var(--em-soft)}
.chip.violet{color:var(--violet);border-color:rgba(150,134,255,.4);background:var(--violet-soft)}
.chip.red{color:var(--danger);border-color:rgba(244,100,106,.4);background:var(--danger-soft)}

/* ---------- brand ---------- */
.mark{width:38px;height:38px;flex:none}
.brand{display:flex;align-items:center;gap:12px;cursor:default;user-select:none}
.bstack{display:flex;flex-direction:column;line-height:1.05}
.bsm{font-size:9.5px;letter-spacing:.32em;font-weight:800;color:var(--gold);text-transform:uppercase}
.bbig{font-size:19px;font-weight:800;letter-spacing:-.01em;background:linear-gradient(90deg,var(--ink),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="light"] .bbig{background:linear-gradient(90deg,#0e1730,#8a5f0f);-webkit-background-clip:text;background-clip:text}
.ver{font:600 10.5px var(--f-num);color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:3px 9px;white-space:nowrap}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.uchip{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2)}
.ava{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11px;color:#1b1306;background:linear-gradient(135deg,var(--gold2),var(--gold))}
.uchip b{font-size:12px;display:block;line-height:1.1}.uchip small{font-size:10px;color:var(--muted)}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--dim);display:inline-block}
.sdot.ok{background:var(--em);box-shadow:0 0 10px var(--em)}.sdot.warn{background:var(--amber);box-shadow:0 0 10px var(--amber)}.sdot.bad{background:var(--danger)}

/* ---------- notice ---------- */
.notice{display:flex;align-items:center;gap:10px;padding:7px 22px;background:linear-gradient(90deg,var(--violet-soft),transparent);border-bottom:1px solid var(--line);overflow:hidden;font-size:13px}
.notice.urgent{background:linear-gradient(90deg,var(--danger-soft),transparent)}
.ntag{font-size:10px;font-weight:800;letter-spacing:.14em;padding:2px 9px;border-radius:999px;background:var(--violet);color:#fff;flex:none}
.notice.urgent .ntag{background:var(--danger)}
.ntrack{overflow:hidden;flex:1;white-space:nowrap}.nmove{display:inline-block;padding-left:100%;animation:nm 25s linear infinite}
@keyframes nm{to{transform:translateX(-100%)}}

/* ---------- process rail ---------- */
.rail{display:flex;gap:10px;padding:16px 22px 4px;overflow-x:auto}
.pbtn{display:flex;align-items:center;gap:10px;border-radius:999px;padding:8px 18px 8px 8px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;transition:.2s;min-width:max-content}
.pbtn:hover{border-color:var(--gold);transform:translateY(-1px)}
.pbtn .pi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted)}
.pbtn b{display:block;font-size:13.5px;line-height:1.1}.pbtn small{font-size:10.5px;color:var(--muted)}
.pbtn.on{background:linear-gradient(135deg,rgba(230,187,98,.18),rgba(150,134,255,.12));border-color:var(--gold);box-shadow:0 10px 28px rgba(0,0,0,.25)}
.pbtn.on .pi{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1306;border-color:transparent}
.pbtn.soon{opacity:.55}
.pbtn .pl{width:8px;height:8px;border-radius:50%;background:var(--dim);margin-left:4px}.pbtn .pl.on{background:var(--em);box-shadow:0 0 9px var(--em)}

/* ---------- layout ---------- */
.wrap{padding:14px 22px 60px;max-width:1720px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:15px;font-weight:750;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
.hero h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--gold)}
.hero p{margin:4px 0 0;color:var(--muted);font-size:13px}
.rules{display:flex;gap:8px;flex-wrap:wrap}
.rule{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);border-radius:14px;padding:7px 12px;font-size:12px}
.rule .lt{font:700 12px var(--f-num);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold2)}
:root[data-theme="light"] .rule .lt{color:var(--gold2)}
.rule small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.kpi:after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:var(--kc,var(--gold));opacity:.08}
.kpi small{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.kpi b{display:block;font:700 26px var(--f-num);margin-top:4px;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:11.5px;color:var(--muted)}

/* column lights */

.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;margin:14px 0}
@media (max-width:1100px){.cols2{grid-template-columns:1fr}}
.drop{border:1.5px dashed var(--line2);border-radius:16px;padding:12px;background:var(--bg2);transition:.2s;position:relative}
.drop.over{border-color:var(--em);background:var(--em-soft)}
.drop textarea{width:100%;min-height:92px;border:0;background:transparent;padding:4px;font:12px var(--f-num);box-shadow:none!important}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:12px 0 6px;display:block}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--bg2);border:1px solid var(--line2);gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1306;box-shadow:0 4px 14px rgba(230,187,98,.3)}
:root[data-theme="light"] .seg button.on{color:#fff;background:linear-gradient(135deg,#d3a240,#b07d1f)}
.pct{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pct button{border-radius:999px;border:1px solid var(--line2);background:var(--panel2);padding:6px 13px;font:700 12px var(--f-num);cursor:pointer;transition:.15s}
.pct button:hover{border-color:var(--gold)}
.pct button.on{background:var(--em-soft);border-color:var(--em);color:var(--em);box-shadow:0 0 0 3px rgba(47,210,122,.12)}
.pct input{width:110px;text-align:center;border-radius:999px;font-family:var(--f-num)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.hint b{color:var(--ink)}

/* range bar */
.rbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:12px}
.rbar input[type=date]{padding:6px 10px;border-radius:999px}
.rbar .sp{flex:1}
.dchips{display:flex;gap:5px;flex-wrap:wrap;max-height:62px;overflow:auto}
.dc{font:600 11px var(--f-num);border-radius:999px;border:1px solid var(--line2);padding:3px 9px;background:var(--panel2);cursor:pointer;color:var(--muted)}
.dc.in{color:var(--em);border-color:rgba(47,210,122,.45);background:var(--em-soft)}

/* grid */
.gridcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ghead h3{margin:0;font-size:14.5px}
.ghead .sp{flex:1}
.gbox{overflow:auto;max-height:62vh}
table.g{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.g th,table.g td{padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;max-width:360px;overflow:hidden;text-overflow:ellipsis}
table.g thead th{position:sticky;top:0;z-index:3;background:var(--hdr);color:#eef2fb;font-size:11.5px;font-weight:700;letter-spacing:.02em;border-bottom:0}
table.g thead th .cl{display:block;font:600 9.5px var(--f-num);color:#9fb0d6;letter-spacing:.06em}
table.g thead th.key{box-shadow:inset 0 -3px 0 var(--gold)}
table.g thead tr.flt th{top:42px;background:var(--panel2);padding:5px 6px;border-bottom:1px solid var(--line)}
table.g thead tr.flt input{width:100%;min-width:70px;padding:4px 8px;font-size:11.5px;border-radius:8px}
table.g td.n,table.g th.n{position:sticky;left:0;z-index:2;background:var(--panel);color:var(--dim);font:600 11px var(--f-num);text-align:right;min-width:52px}
table.g thead th.n{z-index:4;background:var(--hdr)}
table.g thead tr.flt th.n{background:var(--panel2)}
table.g tbody tr:hover td{background:var(--gold-soft)}
table.g tbody tr.pk td{background:var(--em-soft)}
table.g tbody tr.pk td.n{color:var(--em)}
table.g tbody tr.new td.n{box-shadow:inset 3px 0 0 var(--violet)}
table.g td.num{font-family:var(--f-num);font-size:12px}
table.g td.empty{color:var(--dim)}
.pager{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
.pager .sp{flex:1}
.empty-state{padding:56px 20px;text-align:center;color:var(--muted)}
.empty-state .big{font-size:42px;margin-bottom:8px}
.xrow{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:12px;padding:0 4px}
.xrow:hover{color:var(--danger)}

/* results */
.res{margin-top:14px}
.rsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0 14px}
.ucard{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--panel2)}
.ucard b{font-size:13px}.ucard .bar{height:6px;border-radius:9px;background:var(--bg2);margin:9px 0 6px;overflow:hidden}
.ucard .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--em),var(--teal))}
.ucard .nums{display:flex;justify-content:space-between;font:600 11.5px var(--f-num);color:var(--muted)}
.ucard .nums em{font-style:normal;color:var(--em)}

/* gate / lock */
.gate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;overflow:auto;
  background:radial-gradient(800px 500px at 50% 20%,rgba(150,134,255,.18),transparent 60%),radial-gradient(700px 500px at 50% 110%,rgba(230,187,98,.16),transparent 60%),#04070f}
.orb{position:fixed;width:620px;height:620px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle at 50% 50%,#04070f 54%,transparent 55%),conic-gradient(from 0deg,rgba(230,187,98,.0),rgba(230,187,98,.55),rgba(150,134,255,.45),rgba(52,209,196,.35),rgba(230,187,98,.0));
  filter:blur(18px);opacity:.55;animation:spin 22s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.lcard{position:relative;width:min(440px,100%);background:rgba(13,20,38,.78);border:1px solid rgba(230,187,98,.25);border-radius:28px;padding:34px 32px 26px;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.6);color:#eaf0fb;text-align:center}
.lcard .mark{width:64px;height:64px;margin:0 auto 12px;display:block}
.l1{font-size:11px;letter-spacing:.42em;font-weight:800;color:#e6bb62}
.l2{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:8px 0 6px;background:linear-gradient(90deg,#fff,#f7dc98);-webkit-background-clip:text;background-clip:text;color:transparent}
.l3{font-size:11px;letter-spacing:.42em;font-weight:800;color:#9686ff}
.lcard .ver{color:#9fb0d6;border-color:rgba(255,255,255,.18);display:inline-block;margin-top:12px}
.lcard input{width:100%;margin-top:12px;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14);color:#fff;padding:12px 16px;border-radius:999px;text-align:center;letter-spacing:.04em}
.lcard .cap{width:100%;margin-top:16px;padding:12px}
.lnk{display:block;margin:12px auto 0;border:0;background:none;color:#9fb0d6;font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:#f7dc98}
.err{min-height:18px;margin-top:10px;font-size:12.5px;color:#ff9da1}
.ok-line{font-size:12px;color:#6ee7a8;margin-top:10px}
.lfoot{margin-top:18px;font-size:10.5px;color:#5d6886;letter-spacing:.06em}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:90;background:rgba(3,6,14,.62);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.mcard{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:24px;padding:22px;box-shadow:var(--shadow);animation:pop .18s ease}
.mcard.wide{width:min(1100px,100%)}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.mcard h3{margin:0 0 6px;font-size:18px}
.mcard .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--panel);border:1px solid var(--gold);color:var(--ink);padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);font-weight:600;font-size:13px;animation:pop .2s ease}
.map{width:100%;border-collapse:collapse;font-size:12.5px}
.map td,.map th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
.map th{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.map .arrow{color:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);position:sticky;top:0;background:var(--panel)}
.scroll{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:14px}

/* admin */
.adminpg{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}
.ahead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--glass);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ahead .sp{flex:1}
.atabs{display:flex;gap:6px;flex-wrap:wrap}

/* date parser: 10/05/2026, 10/5/26, 2026-10-05, Excel serial, 05-Oct-2026 → ISO */
function toISO(v){
  if(v==null)return "";let s=String(v).trim();if(!s)return "";
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return mk(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return mk(y,+m[1],+m[2])}
  m=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[A-Za-z]*[\s\-,]+(\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;const mo=MONS.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mo>=0)return mk(y,mo+1,+m[1])}
  if(/^\d{5}(\.\d+)?$/.test(s)){const n=+s;if(n>20000&&n<80000){const d=new Date(Math.round((n-25569)*864e5));return mk(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}}
  return "";
  function mk(y,mo,d){if(mo<1||mo>12||d<1||d>31||y<1990||y>2100)return "";return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
}

/* ---------- hashing and file lock (AES-GCM, light protection) ---------- */
const H=(str,seed=161)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const b64=u=>{let s="";for(const x of new Uint8Array(u))s+=String.fromCharCode(x);return btoa(s)},unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let _fk=null;
async function fkey(){if(_fk)return _fk;const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(FILE_KEY),"PBKDF2",false,["deriveKey"]);return _fk=await crypto.subtle.deriveKey({name:"PBKDF2",salt:new TextEncoder().encode("ppqa-v1"),iterations:60000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encT(t){const iv=crypto.getRandomValues(new Uint8Array(12));return "PPQ1:"+b64(iv)+":"+b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},await fkey(),new TextEncoder().encode(t)))}
async function decT(s){const p=String(s).trim().split(":");return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb(p[1])},await fkey(),unb(p[2])))}
const unlock=async t=>/^PPQ1:/.test(String(t).trim())?decT(t):t;
async function sha(t){try{return b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))}catch(e){return "h"+H(t)}}
const isMaster=async p=>{const q=String(p||"");if(S.cfg.mph)return(await sha("master|"+q))===S.cfg.mph;return H(q.replace(/\s+/g,"").toLowerCase())===PW_MASTER};

async function fsScan(){
  if(!FS.dir)return;const idx={};
  try{
    for(const p of procs()){
      let ph;try{ph=await FS.dir.getDirectoryHandle(p.k)}catch(e){continue}
      for await(const [yn,yh] of ph.entries()){if(yh.kind!=="directory"||!/^\d{4}$/.test(yn))continue;
        for await(const [mn,mh] of yh.entries()){if(mh.kind!=="directory")continue;
          for await(const [fn,fh] of mh.entries()){const m=fn.match(/^(\d{4}-\d{2}-\d{2})\.json$/);if(fh.kind==="file"&&m)idx[dkey(p.k,m[1])]={h:fh}}}}
    }
    FS.index=idx;FS.err=false;
    /* dates deleted in the folder by Admin disappear from this PC too */
    let gone=0;for(const k of Object.keys(S.days)){if(!idx[k]&&S.days[k]&&S.days[k]._lm){delete S.days[k];gone++}}if(gone)save();
    await fsReadConfig();
  }catch(e){FS.err=true;toast("Couldn't read the data folder")}
  paintSync();
}

  return fsWritePlain("_mailbox","help_"+Date.now()+"_"+m.replace(/[^A-Z0-9]/gi,"")+".json",JSON.stringify(o,null,1));

  try{if(FS.handle&&!FS.dir){if(await FS.handle.requestPermission({mode:"readwrite"})==="granted"){FS.dir=FS.handle;await fsReadConfig(true);await fsScan();return}}
    const h=await window.showDirectoryPicker({id:"ppqa-data",mode:"readwrite"});const bad=await folderOK(h,false);if(bad){gateMsg=bad;return}
    FS.handle=h;FS.dir=h;await IDB.put("dirHandle",h);await fsReadConfig(true);await fsScan()}catch(e){}
}
function gate(mode,msg){

     :`<button class="cap violet" id="gConn" style="width:100%;margin-top:18px;padding:11px">🔌 ${FS.handle?"Allow the data server (one click)":"Step 1 · Connect data server"}</button>
       <div style="font-size:11.5px;color:#8d99b8;margin-top:6px">Pick the shared folder “${esc(S.cfg.folder||DEF_FOLDER)}”</div>`}
   <p style="color:#9fb0d6;margin:14px 0 0;font-size:12.5px;line-height:1.5">${setup?"Set or reset your password. Enter your MSID and this PC's device name (Settings → System → About).":(FS.dir?"":"Step 2 · ")+"Sign in with your MSID and password."}</p>

   ${setup?`<input id="gPw2" type="password" placeholder="Repeat password" autocomplete="off">`:""}

   <div class="err" id="gErr">${msg||""}</div>`;
  $("#gAlt").onclick=()=>gate(setup?"login":"setup");
  const gc=$("#gConn");if(gc)gc.onclick=async()=>{await gateConnect();const m=gateMsg;gateMsg="";gate(mode,FS.dir?"":(m||"Server not connected."))};
  $("#gGo").onclick=()=>gateGo(setup);$("#gateBody").onkeydown=e=>{if(e.key==="Enter")gateGo(setup)};
  {const f=$(last?(setup?"#gD":"#gPw"):"#gM");if(f)f.focus()}
}
function doneLogin(m){TRY.set(m,null);LS.set("lastmsid",m);LS.set("msid",m);SESS.set(true);resolveMe();logAct("login","",ROLEN(me.role));enter()}
async function gateGo(setup){
  const err=t=>{$("#gErr").innerHTML=t},m=$("#gM").value.trim().toUpperCase().replace(/\s+/g,""),pw=$("#gPw").value;
  if(m.length<2)return err("Enter your MSID.");
  const tr=TRY.get(m);if(tr.until>Date.now()){err("🙂 Taking a short break — please try again after "+new Date(tr.until).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})+".");return helpPopup(m,"Sign-in paused after several wrong passwords")}
  const bad=async(t,why)=>{const x=TRY.get(m);x.n=(x.n||0)+1;const max=+S.cfg.maxTry||5;
    if(x.n>=max){x.until=Date.now()+15*6e4;x.n=0;TRY.set(m,x);const w=max+" wrong passwords in a row";alertLog(m,"Paused for 15 min after "+w);await autoMail(m,w+" (sign-in paused for 15 minutes)");
      err("🙂 Taking a short break — try again in 15 minutes.");return helpPopup(m,w)}
    if(why)alertLog(m,why);TRY.set(m,x);err(t+(x.n>=max-2?` <span style="color:#9fb0d6">(${max-x.n} tr${max-x.n===1?"y":"ies"} left)</span>`:""))};
  if(m===ADMIN_MSID){if(!(await isMaster(pw)))return bad("Password is wrong.","Wrong Admin password");return doneLogin(m)}
  const u=userOf(m);
  if(!u){if(FS.dir)alertLog(m,"Unregistered MSID tried to sign in");return err(!FS.dir?"Connect the data server first, then sign in.":"<b>Access Denied.</b> MSID "+esc(m)+" is not registered. Please contact Administration.")}
  if(u.until&&daysLeft(u.until)<0){alertLog(m,"Sign in after access expired");return err("<b>Access expired</b> on "+us(u.until)+". Please contact Administration.")}
  if(setup){
    const d=$("#gD").value.trim().toUpperCase().replace(/\..*$/,""),p2=$("#gPw2").value;
    if(!FS.dir)return err("Connect the data server first, so your password is saved for everyone.");
    if(!u.mc)return err("No device name is saved for "+esc(m)+". Ask Administration to add it.");
    if(d!==String(u.mc).toUpperCase())return bad("Device name doesn't match the list. Check Settings → System → About.","Password reset tried with a wrong device name");
    if(pw.length<4)return err("Password needs at least 4 characters.");if(pw!==p2)return err("The two passwords don't match.");
    const old=await authGet(m);
    await authPut(m,{h:await sha(m+"|"+pw),did:DID(),at:Date.now()});
    if(old&&old.did!==DID())logAct("moved","",m+" moved to a new PC");
    return doneLogin(m);
  }
  const a=await authGet(m);
  if(!a)return err(FS.dir?"No password yet. Tap “First time or forgot password?” to set one.":"Connect the data server first, then sign in.");
  if(a.h!==await sha(m+"|"+pw))return bad("Password is wrong.","Wrong password");
  if(a.did!==DID()){alertLog(m,"Sign in from a different PC / browser (blocked)");if(S.cfg.alertOther)autoMail(m,"Someone tried to use this MSID from a different PC");return err("<b>This MSID is linked to another PC.</b> Nobody else can use it. Use “First time or forgot password?” with your device name to move it.")}
  doneLogin(m);
}

let idleT=null,idleLast=0;
function idleReset(){clearTimeout(idleT);const m=+S.cfg.idleMin||0;if(!LOCK_ON||!m||$("#app").hidden&&$("#adminPg").hidden)return;
  idleT=setTimeout(()=>{if(Object.values(FRESH).some(a=>a&&a.length))return idleReset();SESS.set(false);view.as=null;$("#adminPg").hidden=true;gate("login","Locked after "+m+" minutes idle. Sign in again.")},m*6e4)}
["mousemove","keydown","pointerdown","wheel"].forEach(ev=>document.addEventListener(ev,()=>{if(Date.now()-idleLast>3000){idleLast=Date.now();idleReset()}},{passive:true}));

/* ================= process screen (build 2 · compact) ================= */
const FRESH={};             // unsaved rows per process (dumped, not saved yet)
let RID=0;
const P=()=>procOf(view.proc);
const hIdx=(p,h)=>h?p.cols.findIndex(c=>norm(c)===norm(h)):-1;
const dIdx=p=>p.dyn?hIdx(p,p.dh):colI(p.dc),uIdx=p=>p.dyn?hIdx(p,p.uh):colI(p.uc);
const dLet=p=>{const i=dIdx(p);return i<0?"—":colL(i)},uLet=p=>{const i=uIdx(p);return i<0?"—":colL(i)};
const sigOf=v=>v.map(x=>String(x??"").trim()).join("\u0001");
const rowUser=(p,r)=>{const i=uIdx(p);return i<0?"":String(r.v[i]??"").trim()};
const userKey=s=>norm(s);
function mineMatch(p,r){
  const u=userKey(rowUser(p,r));if(!u)return false;const id=ident();
  return [id.name,id.code,id.pc,(identUser()||{}).code].filter(Boolean).some(x=>{const k=userKey(x);return k&&(u===k||u.includes(k)&&k.length>=4)});
}
function scoped(p,rows){return scope()==="own"?rows.filter(r=>mineMatch(p,r)):rows}
function allRows(){const p=P();if(!p)return [];return scoped(p,view.rows.concat(FRESH[p.k]||[]))}
const cmp=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:"base"});
function filteredRows(skipCol){
  const q=norm(view.q),ks=Object.keys(view.f).filter(k=>+k!==skipCol&&Array.isArray(view.f[k]));const sets=ks.map(k=>[+k,new Set(view.f[k])]);
  const pk=view.pick?view.pick.ids:null;
  let out=allRows().filter(r=>{
    for(const [i,st] of sets){if(!st.has(String(r.v[i]??"").trim()))return false}
    if(q&&!norm(r.v.join(" ")).includes(q))return false;
    if(view.onlyPk&&pk&&!pk.has(r.id))return false;return true});
  if(view.sort&&skipCol==null){const {i,dir}=view.sort;out=out.slice().sort((a,b)=>dir*cmp(a.v[i]??"",b.v[i]??""))}
  return out;
}

async function openProc(k){
  const p=procOf(k);if(!p)return;
  view.proc=k;LS.set("proc",k);view.f={};view.q="";view.sort=null;view.onlyPk=false;view.page=0;view.pick=null;view.pdate="";view.puser="";view.cleared=false;
  const ds=savedDates(k);view.from=view.to=ds[0]||"";
  renderRail();renderProc();await loadRange();
}
async function loadRange(){
  const p=P();if(!p)return;view.rows=[];
  if(view.from&&view.to&&!view.cleared){
    const ds=savedDates(p.k).filter(d=>d>=view.from&&d<=view.to).sort(),objs=[];
    for(const d of ds){const o=await loadDay(p.k,d);if(o)objs.push([d,o])}
    if(p.dyn){let add=false;objs.forEach(([d,o])=>(o.cols||[]).forEach(c=>{if(!p.cols.some(x=>norm(x)===norm(c))){p.cols.push(c);add=true}}));if(add){autoRule(p);renderProc()}}
    objs.forEach(([d,o])=>view.rows.push(...dayRows(p,d,o)));
  }
  view.page=0;paintAll();
}
/* a saved date file → row objects (re-mapped by heading name) */
function dayRows(p,d,o){
  const same=JSON.stringify(o.cols||[])===JSON.stringify(p.cols);
  const map=same?null:p.cols.map(c=>(o.cols||[]).findIndex(x=>norm(x)===norm(c)));
  return (o.rows||[]).map(v=>{const vv=same?v.slice():map.map(j=>j<0?"":v[j]??"");while(vv.length<p.cols.length)vv.push("");return{id:++RID,v:vv,d,s:"saved"}});
}
/* Other process: guess the date and user headings */
function autoRule(p){
  if(!p.dyn)return;const rows=(FRESH[p.k]||[]).concat(view.rows);
  const rate=i=>{const s=rows.slice(0,200).map(r=>r.v[i]).filter(x=>String(x??"").trim());return s.length?s.filter(x=>toISO(x)).length/s.length:0};
  if(hIdx(p,p.dh)<0){let best=-1;p.cols.forEach((c,i)=>{if(best<0&&/date|dos|dt$/i.test(c)&&rate(i)>=.5)best=i});if(best<0)p.cols.forEach((c,i)=>{if(best<0&&rate(i)>=.8)best=i});p.dh=best>=0?p.cols[best]:""}
  if(hIdx(p,p.uh)<0){const bad=/group|provider|first|last|middle|file|health|plan|claim|state|city|street/i;
    let i=p.cols.findIndex(c=>/^(name|user ?id|user|opid|dla|agent|associate|processor|employee|emp ?name|user ?name)$/i.test(String(c).trim()));
    if(i<0)i=p.cols.findIndex(c=>/(name|user|opid|dla|agent|associate|processor|employee)/i.test(c)&&!bad.test(c));p.uh=i>=0?p.cols[i]:""}
}
const rebucket=p=>{const dc=dIdx(p),t=todayISO();(FRESH[p.k]||[]).forEach(r=>{r.d=(dc>=0&&toISO(r.v[dc]))||r.d0||t})};

    <div class="gbox" id="gbox"></div>
    <div class="pager"><span class="chip" id="gCount"></span><span class="chip em" id="gLt" ${can("lights")?"":"hidden"}></span><span class="chip violet" id="gNew" hidden></span><span class="chip em" id="gPk" hidden></span>
      <label class="tg sm" id="gOnly" hidden><input type="checkbox" id="gOnlyC"><span class="sw"></span>Only picked</label>
      <span id="pager" style="display:contents"></span><span class="sp"></span>
      ${can("filters")?`<span class="chip gold" id="gFl" hidden></span><input id="gq" placeholder="🔎 Search anything…" style="max-width:220px;border-radius:999px;padding:3px 12px;font-size:12px" value="${esc(view.q)}"><button class="cap xs ghost" id="gReset">Reset filters</button>`:""}
    </div>

/* Save · Excel · Clear on the process line (right side) */
function renderActs(){

/* ================= smart dump: any screen → right process by headings → lights ================= */
function parseTSV(t){
  t=String(t).replace(/\r\n?/g,"\n");const out=[];let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch;continue}
    if(ch==='"'&&cell===""){q=true;continue}
    if(ch==="\t"){row.push(cell);cell="";continue}
    if(ch==="\n"){row.push(cell);out.push(row);row=[];cell="";continue}
    cell+=ch}
  if(cell!==""||row.length){row.push(cell);out.push(row)}
  return out.filter(r=>r.some(c=>String(c).trim()));
}
/* one cell → text exactly as the team sees it (long numbers whole, leading zeros kept) */
function cellText(c){
  if(!c||c.v==null)return "";
  if(c.t==="n"){
    const z=c.z||"General";
    if(z!=="General"&&XLSX.SSF.is_date(z)){const d=XLSX.SSF.parse_date_code(c.v);if(d)return String(d.m).padStart(2,"0")+"/"+String(d.d).padStart(2,"0")+"/"+d.y}
    if(z==="General"||z==="@"){return Number.isInteger(c.v)?String(c.v):String(+c.v.toPrecision(15))}
    return c.w!=null?String(c.w).trim():String(c.v);
  }
  if(c.t==="d"){const d=c.v;return String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0")+"/"+d.getFullYear()}
  if(c.t==="b")return c.v?"TRUE":"FALSE";
  return String(c.w!=null&&c.t!=="s"?c.w:c.v).replace(/\s+$/,"");
}
function sheetAOA(ws){
  if(!ws||!ws["!ref"])return [];const r=XLSX.utils.decode_range(ws["!ref"]),out=[];
  for(let R=r.s.r;R<=r.e.r;R++){const row=[];for(let C=r.s.c;C<=r.e.c;C++)row.push(cellText(ws[XLSX.utils.encode_cell({r:R,c:C})]));if(row.some(x=>x.trim()))out.push(row)}
  return out;
}
const sheetFits=(name,p)=>{if(p.dyn)return /^other/i.test(String(name).trim());const a=norm(name),b=norm(p.k),c=norm(p.label);if(!a)return false;if(a===b||a===c)return true;
  if(b.startsWith("pend")&&/^pe?nd?52$/.test(a))return true;if(b.startsWith("xc")&&/(xc|dbm)/.test(a))return true;if(b==="repricing"&&/^rep/.test(a))return true;return a.length>=3&&(b.startsWith(a)||a.startsWith(b))};
const dumpProcs=()=>procs().filter(x=>procVisible(x)&&(x.status==="live"||role()==="admin"));
async function handleFile(f){

  const hits=dumpProcs().map(x=>({p:x,s:wb.SheetNames.find(n=>sheetFits(n,x))})).filter(h=>h.s);
  if(hits.length>1){ /* the team workbook: one sheet per process */
    const info=hits.map(h=>{const aoa=sheetAOA(wb.Sheets[h.s]);return{...h,aoa,n:Math.max(0,aoa.length-1)}});
    modal(`<h3>📚 Team workbook found</h3><p class="muted" style="margin:0 0 12px">${esc(f.name)} has a sheet for ${info.length} processes. Tick the ones to load — each sheet goes into its own process (saved only when you click Save).</p>
     <div class="scroll"><table class="tbl"><thead><tr><th></th><th>Process</th><th>Sheet</th><th>Rows</th></tr></thead><tbody>
     ${info.map((h,i)=>`<tr><td><input type="checkbox" data-wb="${i}" ${h.n?"checked":""}></td><td><b>${esc(h.p.label)}</b></td><td class="mono">${esc(h.s)}</td><td class="mono">${nf(h.n)}</td></tr>`).join("")}
     </tbody></table></div>
     <div class="mrow"><button class="cap" data-close>Cancel</button><button class="cap gold" id="wbGo">Load ticked sheets</button></div>`,true);
    $("#wbGo").onclick=()=>{const pick=$$("#mcard [data-wb]").filter(c=>c.checked).map(c=>info[+c.dataset.wb]);closeModal();let tot=0;const lines=[];
      pick.forEach(h=>{const r=buildRows(h.p,h.aoa);if(r.ok){if(h.p.dyn){h.p.cols=r.cols;autoRule(h.p)}FRESH[h.p.k]=(FRESH[h.p.k]||[]).concat(r.rows);tot+=r.rows.length;lines.push(h.p.label+" "+nf(r.rows.length))}});

/* heading match: exact → starts-with → shared words; one source column per heading */
function matchHeads(src,cols){
  const pairs=[];
  src.forEach((h,i)=>{const a=norm(h);if(!a)return;const aw=String(h).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    cols.forEach((c,j)=>{const b=norm(c);let s=0;
      if(a===b)s=100;else if(a.length>=3&&b.length>=3&&(a.startsWith(b)||b.startsWith(a)))s=72-Math.min(20,Math.abs(a.length-b.length));
      else{const bw=String(c).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);const inter=aw.filter(w=>bw.includes(w)).length,uni=new Set([...aw,...bw]).size;if(inter&&uni)s=Math.round(55*inter/uni)}
      if(s>=40)pairs.push({i,j,s,d:Math.abs(i-j)})})});
  pairs.sort((x,y)=>y.s-x.s||x.d-y.d);
  const m={},usedJ=new Set();pairs.forEach(x=>{if(m[x.i]==null&&!usedJ.has(x.j)){m[x.i]=x.j;usedJ.add(x.j)}});

async function xlsxBook(sheets,fname){
  if(typeof ExcelJS==="undefined"){ /* fallback: plain SheetJS */
    if(typeof XLSX==="undefined"){toast("Excel library didn't load (no internet?)");return}
    const wb=XLSX.utils.book_new();sheets.forEach(s=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[s.title],[s.sub],s.head,...s.rows]),s.name.slice(0,31)));XLSX.writeFile(wb,fname);return}
  const wb=new ExcelJS.Workbook();wb.creator="Alpha NextGen · Provider Pick QA · Eclipse";wb.created=new Date();
  sheets.forEach(s=>{
    const ws=wb.addWorksheet(s.name.slice(0,31),{views:[{state:"frozen",ySplit:3}]});
    ws.mergeCells(1,1,1,Math.max(2,s.head.length));const t=ws.getCell(1,1);t.value=s.title;t.font={bold:true,size:14,color:{argb:"FF14213F"}};
    ws.mergeCells(2,1,2,Math.max(2,s.head.length));const st=ws.getCell(2,1);st.value=s.sub;st.font={italic:true,size:10,color:{argb:"FF5A6684"}};
    const hr=ws.getRow(3);s.head.forEach((h,i)=>{const c=hr.getCell(i+1);c.value=h;c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:s.color||"FF14213F"}};c.alignment={vertical:"middle",horizontal:"center",wrapText:true};c.border={bottom:{style:"thin",color:{argb:"FFE6BB62"}}}});hr.height=30;
    s.rows.forEach((r,ri)=>{const row=ws.addRow(r);row.eachCell({includeEmpty:true},(c,ci)=>{c.numFmt=s.num&&s.num.includes(ci-1)?"0":"@";c.border={bottom:{style:"hair",color:{argb:"FFDFE4EF"}}};if(ri%2)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFF6F8FC"}}})});
    s.head.forEach((h,i)=>{let w=String(h).length;s.rows.slice(0,300).forEach(r=>{w=Math.max(w,String(r[i]??"").length)});ws.getColumn(i+1).width=Math.min(48,Math.max(9,w+2))});
    ws.autoFilter={from:{row:3,column:1},to:{row:3,column:s.head.length}};
    if(S.cfg.wm!==false){ws.headerFooter.oddFooter="&L"+stampTxt()+"&RPage &P of &N"}
  });
  const buf=await wb.xlsx.writeBuffer();saveBlob(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),fname);
}
const stampTxt=()=>(S.cfg.wm!==false?"Confidential · "+me.pc+" · ":"")+new Date().toLocaleString("en-IN");
async function exportPick(pk,p){
  const list=[];pk.groups.forEach(g=>g.rows.forEach(r=>list.push({g,r})));
  const head=["QA #",...(pk.mode==="date"?["Pick date"]:[]),"Pick user",...p.cols];
  const rows=list.map((x,i)=>[i+1,...(pk.mode==="date"?[us(x.g.d)]:[]),x.g.u,...p.cols.map((c,j)=>x.r.v[j]??"")]);
  const sumH=pk.mode==="date"?["Date","User","Total claims","Picked","% picked"]:["User","Total claims","Picked","% picked"];
  const sumR=pk.groups.map(g=>pk.mode==="date"?[us(g.d),g.u,g.total,g.n,g.total?Math.round(g.n/g.total*1000)/10+"%":""]:[g.u,g.total,g.n,g.total?Math.round(g.n/g.total*1000)/10+"%":""]);

    {name:"Summary",title:title+" · summary",sub:"Picked "+new Date(pk.at).toLocaleString("en-IN")+" by "+pk.by,head:sumH,rows:sumR,num:pk.mode==="date"?[2,3]:[1,2]}

  toast("Excel downloaded · "+nf(tp)+" claims");
}

}
async function backupObj(){const all={};for(const k of Object.keys(FS.index)){const u=unkey(k);const o=await loadDay(u.p,u.d);if(o)all[k]=o}Object.keys(S.days).forEach(k=>{if(!all[k])all[k]=S.days[k]});Object.values(all).forEach(o=>delete o._lm);return{app:"Provider Pick QA",ver:APP_VER,build:BUILD,at:new Date().toISOString(),cfg:S.cfg,days:all}}
function wireAdmin3(){
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};
  on("#fsC",async()=>{if(AD.changed){S.cfg.folder=AD.folder}if(await fsConnect()){await fsWriteConfig();renderRail()}openAdmin(3)});
  on("#fsA",async()=>{await fsAllow();openAdmin(3)});on("#fsS",async()=>{await fsSyncUp();await fsWriteConfig();await fsScan();renderRail();openAdmin(3);toast("Synced")});
  on("#fsD",async()=>{await fsDisconnect();openAdmin(3)});
  on("#mpGo",async()=>{const a=$("#mp0").value,b=$("#mp1").value,c=$("#mp2").value;
    if(!(await isMaster(a))){toast("Current password is wrong");return}if(b.length<10){toast("Use 10 or more characters");return}if(b!==c){toast("New passwords don't match");return}
    S.cfg.mph=await sha("master|"+b);AD.mph=S.cfg.mph;await save(true);await fsWriteConfig();await logAct("settings","","master password changed");toast("✓ Master password changed");openAdmin(3)});
  on("#bkB",async()=>{const b=await backupObj();saveBlob(new Blob([await encT(JSON.stringify(b))],{type:"application/json"}),"ProviderPickQA_Backup_"+todayISO()+".json");toast("Backup of "+Object.keys(b.days).length+" dates downloaded")});
  $("#bkR").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const rd=new FileReader();rd.onload=async()=>{let b;try{b=JSON.parse(await unlock(rd.result));if(!b.days)throw 0}catch(x){toast("That file isn't a Provider Pick QA backup");return}
    ask("Restore backup?",Object.keys(b.days).length+" dates from "+(b.at?new Date(b.at).toLocaleString("en-IN"):"the file")+". Dates in the backup replace the same dates here. Settings and users are restored too.","Restore",async()=>{
      for(const [k,o] of Object.entries(b.days)){S.days[k]=o;await fsWriteDay(k,o)}if(b.cfg){SHARED.forEach(k=>{if(b.cfg[k]!==undefined)S.cfg[k]=b.cfg[k]});fixCfg();await fsWriteConfig()}
      await save(true);AD=null;renderRail();openAdmin(3);toast("Backup restored")},true)};rd.readAsText(f)};
  on("#lgOpen",async()=>{const L=(await readLog()).slice(0,500);const AN={login:"Login",save:"Save data (add new)",replace:"Save data (replace date)",pick:"Save pick",delpick:"Delete pick",delrow:"Remove row",deldate:"Delete date",settings:"Settings",blocked:"🚨 Blocked login",moved:"Login moved to new PC"};
    modal(`<h3>📜 History log</h3>${L.length?`<div class="scroll"><table class="tbl"><thead><tr><th>When</th><th>MSID</th><th>Action</th><th>Process</th><th>Note</th></tr></thead><tbody>${L.map(e=>`<tr><td>${new Date(e.at).toLocaleString("en-IN")}</td><td class="mono">${esc(e.pc)}</td><td>${esc(AN[e.a]||e.a)}</td><td>${esc(e.p||"")}</td><td style="white-space:normal">${esc(e.n||"")}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Nothing logged yet.</p>`}<div class="mrow"><button class="cap" data-close>Close</button></div>`,true)});
  $("#adminPg").querySelectorAll("[data-nl]").forEach(c=>c.onchange=()=>{const a=new Set(AD.noLocal||[]);c.checked?a.add(c.dataset.nl):a.delete(c.dataset.nl);AD.noLocal=[...a];adChanged()});
  on("#mailTest",async()=>{if(!FS.dir){toast("Connect the data folder first");return}const keep=S.cfg.alertMails;S.cfg.alertMails=AD.alertMails;const ok=await autoMail("TEST","This is a test from Admin — the help mail works 🎉");S.cfg.alertMails=keep;toast(ok?"Test mail placed in _mailbox · Power Automate sends it in a minute":"Add an email and switch Auto mail on")});
  on("#apSet",()=>{LS.set("adminpc",true);toast("This PC is now the Admin PC");openAdmin(3)});
  on("#apForget",()=>{LS.set("adminpc",false);toast("This PC is no longer the Admin PC");openAdmin(3)});
  on("#alOpen",async()=>{const L=(await readLog()).filter(e=>e.a==="blocked");const files=(await fsList("_system")).filter(n=>/^alert_/.test(n));
    for(const f of files){try{const o=JSON.parse(await fsReadText("_system",f));if(!L.some(e=>e.at===o.at))L.push({at:o.at,pc:o.msid,n:o.t})}catch(e){}}L.sort((a,b)=>b.at-a.at);
    modal(`<h3>🚨 Login alerts</h3><p class="muted" style="margin:0 0 12px">Wrong passwords, unknown MSIDs, sign-in from another PC, locked accounts.</p>${L.length?`<div class="scroll"><table class="tbl"><thead><tr><th>When</th><th>MSID</th><th>What happened</th></tr></thead><tbody>${L.slice(0,500).map(e=>`<tr><td>${new Date(e.at).toLocaleString("en-IN")}</td><td class="mono">${esc(e.pc)}</td><td style="white-space:normal">${esc(e.n||"")}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">No alerts. 👍</p>`}<div class="mrow"><button class="cap" data-close>Close</button></div>`,true)});
  on("#wipe",()=>ask("Clear this PC's copy?","Saved dates are removed from this browser only. The data folder keeps everything.","Clear",async()=>{S.days={};await save(true);if(view.proc)await loadRange();toast("This PC's copy cleared")},true));
}

/* ---------- settings defaults ---------- */
function fixCfg(){
  const c=S.cfg;c.users=Array.isArray(c.users)?c.users:[];
  if(!c.v2){c.perms={};c.scope={};c.users.forEach(u=>{if(u.role==="manager")u.role="sme";delete u.ov});(c.procs||[]).forEach(p=>{if(p.roles&&p.roles.manager!=null){p.roles.sme=p.roles.manager;p.roles.mgr=p.roles.manager;delete p.roles.manager}});c.v2=1}
  c.users.forEach(u=>{if(u.role==="manager")u.role="sme"});
  c.perms=c.perms||{};ROLE3.forEach(r=>c.perms[r]=Object.assign({},DEFPERM[r],c.perms[r]||{}));
  c.scope=Object.assign({},DEFSCOPE,c.scope||{});c.fon=c.fon||{};c.msg=c.msg||{};
  if(!Array.isArray(c.procs)||!c.procs.length)c.procs=clone(PROC0);
  if(!c.procs.some(p=>p.dyn))c.procs.push(clone(PROC0.find(p=>p.dyn)));
  c.procs.forEach(p=>{const d=PROC0.find(x=>x.k===p.k)||{};p.roles=Object.assign({mgr:1,sme:1,entry:1,employee:1},p.roles||{});p.label=p.label||d.label||p.k;p.status=p.status||"live";
    if(d.dyn){p.dyn=true;p.cols=Array.isArray(p.cols)?p.cols:[];p.dh=p.dh||"";p.uh=p.uh||""}else{p.cols=Array.isArray(p.cols)&&p.cols.length?p.cols:(d.cols||[]);p.dc=p.dc||d.dc||"A";p.uc=p.uc||d.uc||"B"}p.ic=p.ic||d.ic||p.k.slice(0,2).toUpperCase()});
  if(c.idleMin===undefined)c.idleMin=15;if(c.askEvery===undefined)c.askEvery=true;if(c.wm===undefined)c.wm=true;if(!Array.isArray(c.noLocal))c.noLocal=["entry","employee"];if(!c.maxTry)c.maxTry=5;if(!Array.isArray(c.alertMails))c.alertMails=["akshay.ranjan@uhc.com","",""];while(c.alertMails.length<3)c.alertMails.push("");if(c.alertAuto===undefined)c.alertAuto=true;if(!c.v3){c.idleMin=0;c.askEvery=false;c.pcts=[5];c.v3=1}if(c.helpPop===undefined)c.helpPop=true;
  c.notice=c.notice||{on:false,text:"",type:"info",speed:25};c.folder=c.folder||DEF_FOLDER;
  c.pcts=Array.isArray(c.pcts)&&c.pcts.length?c.pcts:PCT0.slice();if(c.minOne===undefined)c.minOne=true;
  if(!c.seeded){ROSTER.forEach(([m,code,mc])=>{if(!c.users.some(u=>u.pc===m))c.users.push({pc:m,role:"employee",name:"",team:"",code,mc})});c.seeded=1}
}
